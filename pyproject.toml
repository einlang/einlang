[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "einlang"
dynamic = ["version"]
description = "A programming language for tensor computations with Einstein notation"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
keywords = ["compiler", "einstein-notation", "language", "numpy", "tensor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy>=1.24",
    "lark>=1.1",
    "sexpdata>=1.0",
    "typing_extensions>=3.7",
]

[project.urls]
Homepage = "https://github.com/einlang/einlang"
Repository = "https://github.com/einlang/einlang"
Documentation = "https://github.com/einlang/einlang/tree/main/docs"
Issues = "https://github.com/einlang/einlang/issues"

[project.scripts]
einlang = "einlang.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "einlang._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do not add -n auto here: it breaks --lf (last-failed). For full runs use: pytest tests/ -n auto
addopts = ["--tb=short", "-ra", "--durations=15"]
