meta:
  description: "Einlang is a language for readable tensor programs, built-in differentiation, and shape-checked numerical code."
  brand_tagline: "Readable tensor programs"

hero:
  eyebrow: "Tensor language for machine learning"
  title: "Readable tensor code with built-in differentiation."
  lead_intro: "Einlang is for people who want model code to stay close to the math."
  lead_body: "Write explicit indices, reductions, recurrences, and derivatives in one language. Start with familiar workloads such as linear layers, attention, and losses; then carry the same notation into optimization, simulation, and numerical models."
  actions:
    - label: "Read getting started"
      url: "https://github.com/einlang/einlang/blob/main/docs/GETTING_STARTED.md"
      variant: "primary"
    - label: "Browse examples"
      url: "https://github.com/einlang/einlang/tree/main/examples"
      variant: "secondary"
    - label: "Open repository"
      url: "https://github.com/einlang/einlang"
      variant: "secondary"
  stats:
    - value: "Autodiff"
      label: "built into the language with forms such as @loss / @w and @C / @A"
    - value: "ML to numerics"
      label: "the same notation spans conv, attention, optimization, recurrence, and simulation"
    - value: "Shape-checked"
      label: "tensor structure is validated before execution"
  ribbons:
    - "Matmul and reductions"
    - "Convolutions"
    - "Attention"
    - "Losses and gradients"
    - "Recurrences"
    - "Shape inference"
    - "NumPy backend"
    - "Beyond ML"
  panel:
    label: "model-shaped code"
    code: |
      let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));

      let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
      let dloss_dW = @loss / @W;

showcase:
  label: "Showcase"
  title: "Start with workloads people already recognize."
  intro: "The fastest way to understand Einlang is to see the kinds of programs already in the repository."
  items:
    - title: "Neural network layers"
      text: "Linear layers, reductions, activations, normalization, and tensor reshaping in notation that keeps the index structure visible."
      chips:
        - "matmul"
        - "softmax"
        - "layer-style code"
    - title: "Convolutional models"
      text: "MNIST and quantized MNIST examples show convolution, pooling, loss functions, and training-oriented workflows."
      chips:
        - "mnist/"
        - "mnist_quantized/"
        - "conv + pooling"
    - title: "Attention-style programs"
      text: "Transformer-oriented examples and stdlib coverage make attention, projection, and reduction-heavy code a first-class part of the story."
      chips:
        - "deit_tiny/"
        - "whisper_tiny/"
        - "attention"
    - title: "Autodiff in the same language"
      text: "Differentiate the expressions you wrote instead of leaving the language for a separate gradient API."
      chips:
        - "@expr"
        - "@loss / @w"
        - "@C / @A"
    - title: "Optimization and recurrence"
      text: "Gradient descent, power iteration, value iteration, and recurrence-heavy programs use the same surface language."
      chips:
        - "optimization/"
        - "value_iteration/"
        - "recurrence/"
    - title: "Scientific computing too"
      text: "ODE, PDE, and wave examples show that the notation is broader than ML code."
      chips:
        - "ode/"
        - "pde_1d/"
        - "wave_2d/"

examples:
  label: "Code"
  title: "The language is about explicit tensor structure."
  intro: "These fragments are short on purpose: they should be enough to communicate what Einlang code looks like in practice."
  items:
    - title: "Linear layer"
      text: "The reduction dimension stays in the source instead of being hidden behind framework calls."
      code: |
        let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      note: "A linear layer written as indexed tensor code."
    - title: "Softmax-style normalization"
      text: "Probabilities can be written directly as tensor expressions over explicit axes."
      code: |
        let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));
      note: "Normalization stays local to the expression."
    - title: "Gradient in place"
      text: "Differentiation uses the same values and names already present in the program."
      code: |
        let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
        let dloss_dW = @loss / @W;
      note: "No separate grad(f) wrapper layer."
    - title: "Convolution-style indexing"
      text: "Offset relations remain visible, which matters for model code and numerical kernels alike."
      code: |
        let out[oh, ow] = sum[kh, kw](
          input[ih, iw] * kernel[kh, kw]
        ) where ih = oh + kh, iw = ow + kw;
      note: "Index relations are part of the program."
    - title: "Recurrence"
      text: "Sequential definitions live in the same language instead of moving into framework control flow."
      code: |
        let state[0] = init;
        let state[t in 1..T] = f(state[t - 1], input[t]);
      note: "Useful for sequence models and dynamic programs."
    - title: "Beyond ML"
      text: "The same notation also works for optimization, estimation, and simulation."
      code: |
        let fib[0] = 0;
        let fib[1] = 1;
        let fib[n in 2..25] = fib[n - 1] + fib[n - 2];
      note: "The surface language is broader than model code."

abstract:
  label: "Why Use It"
  title: "Why ML-oriented users might keep reading."
  intro: "Einlang should feel immediately useful to people who already work with tensors, gradients, and model code."
  points:
    - title: "Code that looks like the operation"
      text: "Indices, reduction axes, and dependencies stay visible instead of disappearing behind opaque library calls."
    - title: "Gradients without switching mental models"
      text: "Derivative expressions stay next to the primal program, which keeps optimization and training code easier to inspect."
    - title: "A path beyond framework-shaped code"
      text: "The same notation can describe sequence models, optimization routines, and numerical programs without changing languages."

capabilities:
  label: "Language"
  title: "The core ideas are simple and composable."
  intro: "Einlang is not just a library syntax for one workload. It is a small language for indexed tensor programs."
  items:
    - title: "Explicit indices and reductions"
      text: "Tensor structure is written directly in the source, with reductions such as sum, max, and arg-style computations expressed over named indices."
      chips:
        - "Einstein notation"
        - "reductions"
        - "shape-checked"
    - title: "Where-clauses and index relations"
      text: "Convolution-like offset relations, guards, and bindings can live next to the computation instead of in surrounding bookkeeping."
      chips:
        - "where"
        - "guards"
        - "index algebra"
    - title: "Recurrences and sequential programs"
      text: "State updates, dynamic programming, and recurrence-heavy models use the same declaration style as tensor code."
      chips:
        - "recurrence"
        - "dependency order"
        - "sequence logic"
    - title: "Built-in differentiation"
      text: "Autodiff is part of the language design rather than an external graph-building layer."
      chips:
        - "@expr"
        - "@loss / @w"
        - "compiler integrated"

research:
  label: "Beyond ML"
  title: "The language is broader than model code."
  intro: "Leading with popular ML examples helps people enter the project, but the notation is intended for a wider class of mathematical programs."
  items:
    - value: "Optimization"
      label: "gradient descent, projected methods, and power iteration examples"
    - value: "Recurrence"
      label: "dynamic programs, sequence updates, and dependency-ordered declarations"
    - value: "Simulation"
      label: "ODE, PDE, wave, and reaction-diffusion examples in the same language"
    - value: "Compiler checks"
      label: "type, shape, range, and validation passes before execution"

evidence:
  label: "Repository"
  title: "There is enough here to evaluate the idea seriously."
  intro: "A good front page should point to concrete artifacts rather than abstract claims."
  columns:
    - title: "Examples to open first"
      bullets:
        - "MNIST and quantized MNIST"
        - "DeiT-tiny and Whisper-tiny artifacts"
        - "Optimization, recurrence, and value iteration"
        - "ODE, PDE, and wave examples"
    - title: "Things to inspect"
      bullets:
        - "Language reference and stdlib docs"
        - "Autodiff design and operation coverage"
        - "Compiler passes for shape, range, and lowering"
        - "Backend execution on NumPy today"
  aside:
    title: "Why users may stay"
    text: "The value proposition is not only that the code looks clean. It is that the same notation can cover the main tensor operations people already know, while remaining useful outside standard deep-learning scaffolding."
    chips:
