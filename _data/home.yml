      - "optimization"
      - "simulation"
      - "compiler checks"

compiler:
  label: "Under the Hood"
  title: "There is a real compiler behind the surface syntax."
  intro: "This matters later in the page, after the examples have already answered what the language is for."
  stages:
    - title: "Front-end"
      text: "Grammar, parser, AST nodes, and source-aware diagnostics."
    - title: "Analysis passes"
      text: "Type inference, shape analysis, range analysis, and validation passes before execution."
    - title: "Lowering"
      text: "Einstein notation, reductions, and derivative syntax are transformed through dedicated IR passes."
    - title: "Execution"
      text: "Validation and NumPy-oriented execution support the current runtime path."

models:
  label: "Open These First"
  title: "The quickest way to evaluate Einlang is to run a few recognizable examples."
  intro: "These examples are the most likely entry points for new users arriving from ML-adjacent workflows."
  items:
