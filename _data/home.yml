cta:
  label: "Quick Start"
  title: "Clone the repo, install the package, and run a minimal program."
  intro: "This keeps the homepage grounded in the actual workflow instead of abstract claims."
  command: |
    git clone https://github.com/einlang/einlang.git
    cd einlang
    pip install -e .
    python3 -m einlang examples/hello.ein
  actions:
    - label: "Open examples"
      url: "https://github.com/einlang/einlang/tree/main/examples"
      variant: "primary"
    - label: "Read docs index"
      url: "https://github.com/einlang/einlang/blob/main/docs/README.md"
      variant: "secondary"
  note: "Use the GitHub Pages site as a front door to the compiler, then let the repository provide the evidence."
