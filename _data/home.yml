      text: "Einstein notation, reductions, recurrence definitions, where-constraints, and array expressions are part of the language, not comments around Python."
      chips:
        - "Einstein notation"
        - "Recurrence"
        - "Constraint syntax"
    - title: "Static program analysis"
      text: "Type inference, shape analysis, range analysis, and validation passes operate before execution so tensor code can fail early and locally."
      chips:
        - "Type inference"
        - "Shape analysis"
        - "Range analysis"
    - title: "Built-in differentiation"
      text: "Autodiff is expressed against values in the program with `@expr` and derivative notation, rather than bolted on through a separate graph API."
      chips:
        - "Expression-first"
        - "Tensor-aware rules"
        - "Compiler integrated"
    - title: "Executable numerical workloads"
      text: "The repository already contains examples from ML, optimization, recurrence-heavy programs, and dynamical systems."
      chips:
        - "MNIST"
        - "Whisper-tiny"
        - "ODE and PDE examples"

