hero:
  deck_label: "Einlang"
  eyebrow: "A source language for indexed tensor programs, recurrence, and local derivatives."
  title: "Keep the mathematical structure in the source."
  summary: "Einlang is built around the facts tensor compilers and readers need most: named axes, explicit reductions, recurrent dependencies, and derivative requests over named bindings. Use this page to choose between the tutorial, research writeups, and runnable repository."
  actions:
    - label: "Read the book"
      url: "https://einlang.github.io/einlang/book/"
      variant: "primary"
      icon: "doc"
    - label: "Open the paper"
      url: "https://einlang.github.io/einlang/paper/einlang_paper.pdf"
      variant: "secondary"
      icon: "doc"
    - label: "Open repository"
      url: "https://github.com/einlang/einlang"
      variant: "secondary"
      icon: "repo"
  signal_strip:
    - "Indexed definitions"
    - "Explicit reductions"
    - "Local derivatives"
    - "Declarative recurrence"
    - "Python boundary"
  spotlight:
    label: "60-second taste"
    code: |
      let x = 1.0;
      let y = x * x + 3.0 * x;
      let dy_dx = @y / @x;
