examples:
  label: "Examples"
  title: "Short examples."
  intro: "A few small fragments are often enough to show the surface language."
  items:
    - title: "Linear layer"
      url: "https://github.com/einlang/einlang/blob/main/examples/hello.ein"
      text: "The reduction dimension stays in the source instead of being hidden behind framework calls."
      code: |
        let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      note: "linear layer"
    - title: "Softmax-style normalization"
      url: "https://github.com/einlang/einlang/blob/main/docs/stdlib.md"
      text: "Probabilities can be written directly as tensor expressions over explicit axes."
      code: |
        let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));
      note: "normalization"
    - title: "Gradient in place"
      url: "https://github.com/einlang/einlang/blob/main/examples/autodiff_small.ein"
      text: "Differentiation uses the same names and values already present in the program."
      code: |
        let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
        let dloss_dW = @loss / @W;
      note: "derivative expression"
    - title: "Convolution-style indexing"
      url: "https://github.com/einlang/einlang/tree/main/examples/mnist"
      text: "Offset relations remain visible, which matters for model code and numerical kernels alike."
      code: |
        let out[oh, ow] = sum[kh, kw](
          input[ih, iw] * kernel[kh, kw]
        ) where ih = oh + kh, iw = ow + kw;
      note: "index relation"
    - title: "Recurrence"
      url: "https://github.com/einlang/einlang/tree/main/examples/recurrence"
      text: "Sequential definitions live in the same language instead of moving into framework control flow."
      code: |
        let state[0] = init;
        let state[t in 1..T] = f(state[t - 1], input[t]);
      note: "recurrence"
    - title: "Beyond ML"
      url: "https://github.com/einlang/einlang/tree/main/examples/ode"
      text: "The same notation also works for optimization, estimation, and simulation."
      code: |
        let fib[0] = 0;
        let fib[1] = 1;
        let fib[n in 2..25] = fib[n - 1] + fib[n - 2];
      note: "dynamic program"

abstract:
  label: "Properties"
  title: "What stays explicit."
  intro: "Tensor structure stays visible in the source instead of moving into helper APIs."
  points:
    - title: "Indices stay in the program"
      url: "https://github.com/einlang/einlang/blob/main/docs/WHY_EINLANG.md"
      text: "Indices, reduction axes, and dependencies remain explicit instead of being hidden behind framework calls."
    - title: "Derivatives stay next to the primal"
      url: "https://github.com/einlang/einlang/blob/main/docs/AUTODIFF_HIGHLIGHTS.md"
      text: "Differentiation is written where it is used, which makes training and sensitivity code easier to inspect."
    - title: "The same syntax covers more than model code"
      url: "https://github.com/einlang/einlang/tree/main/examples"
      text: "The repository includes model code, optimization routines, recurrences, and numerical examples."

