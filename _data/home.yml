examples:
  label: "Code Studies"
  title: "Representative fragments from the language."
  intro: "Each example is shown as a compact research-style specimen: short enough to scan, concrete enough to show why the notation matters."
  items:
    - title: "Matrix multiply"
      text: "Indices and the reduction dimension remain explicit, which is the whole point of the language."
      code: |
        let C[i, j] = sum[k](A[i, k] * B[k, j]);
      note: "Linear algebra without loop scaffolding."
    - title: "Recurrence relation"
      text: "Base cases and evolution rule live together, while evaluation order is handled by the compiler."
      code: |
        let fib[0] = 0;
        let fib[1] = 1;
        let fib[n in 2..25] = fib[n - 1] + fib[n - 2];
      note: "Readable recurrence, no manual scheduling."
    - title: "Convolution pattern"
      text: "Offset index algebra stays legible and bounds can be reasoned about from the program structure."
      code: |
        let convolved[i] = sum[k](signal[i + k] * kernel[k]);
      note: "Signal-processing notation, directly executable."
    - title: "Autodiff inside the language"
      text: "Differentiate expressions already defined in the program, without wrapping the problem in another API."
      code: |
        let y = sum[i](x[i] * x[i]);
        let dy_dx = @y / @x;
      note: "Derivatives remain close to the primal expression."
    - title: "Where-clause stencil"
      text: "Index algebra can live next to the update rule, which is useful for convolutions, stencils, and masked computations."
      code: |
        let out[oh, ow] = sum[kh, kw](
          input[ih, iw] * kernel[kh, kw]
        ) where ih = oh + kh, iw = ow + kw;
      note: "Index constraints are part of the program."
    - title: "Gradient descent step"
      text: "Optimization code stays inside the same language instead of crossing into a separate differentiation framework."
      code: |
        let loss = sum[i]((pred[i] - target[i])^2);
        let grad_w = @loss / @w;
        let w_next = w - lr * grad_w;
      note: "Primal and gradient expressions stay together."

