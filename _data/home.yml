meta:
  description: "Einlang is a language and compiler for indexed tensor programs with built-in differentiation and shape checking."
  brand_tagline: "Tensor language and compiler"

hero:
  eyebrow: "Language and compiler for tensor programs"
  title: "Indexed tensor code with built-in differentiation."
  lead_intro: "Einlang keeps tensor structure explicit in the source."
  lead_body: "Write indices, reductions, recurrences, and derivative expressions directly in one language. The same notation works for linear algebra, model code, optimization routines, and numerical programs."
  actions:
    - label: "↗ Getting started"
      url: "https://github.com/einlang/einlang/blob/main/docs/GETTING_STARTED.md"
      variant: "primary"
    - label: "⌘ Examples"
      url: "https://github.com/einlang/einlang/tree/main/examples"
      variant: "secondary"
    - label: "◎ Repository"
      url: "https://github.com/einlang/einlang"
      variant: "secondary"
  stats:
    - value: "Autodiff"
      label: "`@expr`, `@loss / @w`, and `@C / @A` are part of the language"
    - value: "Static checks"
      label: "shape, index, and validation passes run before execution"
    - value: "NumPy today"
      label: "current execution path runs through the NumPy backend"
  ribbons:
    - "Einstein notation"
    - "Matmul and reductions"
    - "Convolutions"
    - "Attention"
    - "Autodiff"
    - "Recurrences"
    - "Shape inference"
    - "NumPy backend"
    - "Optimization and simulation"
  panel:
    label: "example"
    code: |
      let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));

      let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
      let dloss_dW = @loss / @W;

