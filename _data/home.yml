hero:
  deck_label: "Einlang"
  eyebrow: "Explicit indices, in-language autodiff, and tensor code you can still read."
  title: "Tensor math that stays legible."
  summary: "Most tensor stacks hide the important structure behind helper calls, layer wrappers, and gradient machinery. Einlang puts indices, reductions, recurrences, and derivatives directly in the source so the program still reads like the idea."
  actions:
    - label: "Open repository"
      url: "https://github.com/einlang/einlang"
      variant: "primary"
      icon: "repo"
    - label: "See the syntax"
      url: "#language"
      variant: "secondary"
      icon: "code"
    - label: "View examples"
      url: "#workloads"
      variant: "secondary"
      icon: "spark"
  signal_strip:
    - "Indices"
    - "Reductions"
    - "Autodiff"
    - "Recurrences"
  spotlight:
    label: "One expression"
    code: |
      let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));
      let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
      let dloss_dW = @loss / @W;
  status:
    title: "Why it feels different"
    items:
      - "The computational shape stays in view."
      - "Gradients live in the same notation."
      - "Examples scale without changing style."

slides:
  - id: "premise"
    theme: "warm"
    step: "01"
    label: "Why"
    title: "Tensor code should still be readable."
    intro: "Too often, tensor programs vanish into helper calls and framework ceremony. Einlang keeps the important relationships on the page, so the source still reads like the idea behind it."
    points:
      - title: "You can see the axes"
        text: "Indices and reductions are written directly instead of being implied by library calls."
      - title: "You can see the derivative"
        text: "Gradient expressions appear beside the original definitions, not in a separate system."
      - title: "You can stay in one notation"
        text: "The same style carries from simple algebra to recurrences, optimization, and larger models."
    callout:
      label: "The payoff"
      text: "Programs become easier to inspect, easier to explain, and easier to trust."

  - id: "language"
    theme: "ink"
    step: "02"
    label: "Syntax"
    title: "Syntax features, side by side."
    intro: "This section is about syntax, not slogans. Each example shows one language feature in a more typical style and in Einlang, so you can see what the syntax keeps on the page."
    comparisons:
      - title: "Einstein notation"
        takeaway: "Indices and reductions are written directly instead of being hidden in a string or helper call."
        left_label: "NumPy / JAX"
        left_chip: "numpy"
        left_code: |
          y = np.einsum("bi,ci->bc", x, W) + bias
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let y[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      - title: "Where clauses"
        takeaway: "Index relations stay attached to the expression instead of being managed as loop bookkeeping."
        left_label: "Python loops"
        left_chip: "python"
        left_code: |
          for oh in range(H_out):
              for ow in range(W_out):
                  out[oh, ow] = sum(
                      inp[oh + kh, ow + kw] * kernel[kh, kw]
                      for kh in range(KH)
                      for kw in range(KW)
                  )
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let out[oh, ow] = sum[kh, kw](
            input[ih, iw] * kernel[kh, kw]
          ) where ih = oh + kh, iw = ow + kw;
      - title: "Autodiff syntax"
        takeaway: "The derivative is part of the program text, not a separate API wrapped around it."
        left_label: "JAX / framework style"
        left_chip: "jax"
        left_code: |
          def loss_fn(W):
              logits = x @ W.T + bias
              probs = jax.nn.softmax(logits)
              return -(target * jnp.log(probs)).sum()

          dloss_dW = jax.grad(loss_fn)(W)
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
          let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));
          let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
          let dloss_dW = @loss / @W;
      - title: "Fibonacci recurrence"
        takeaway: "The recurrence uses the same tested form as the repo examples: base cases first, then the recursive rule."
        left_label: "Python loop"
        left_chip: "python"
        left_code: |
          fib = np.zeros(11, dtype=int)
          fib[0] = 1
          fib[1] = 1
          for n in range(2, 11):
              fib[n] = fib[n - 1] + fib[n - 2]
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let fib[0] = 1;
          let fib[1] = 1;
          let fib[n in 2..11] = fib[n-1] + fib[n-2];
      - title: "Comprehensions and ranges"
        takeaway: "Generated arrays stay as expressions, and ranges are part of the syntax."
        left_label: "Python"
        left_chip: "python"
        left_code: |
          squares = [i * i for i in range(1, 10)]
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let squares = [i * i | i in 1..10];
      - title: "Block expressions"
        takeaway: "Multiple statements can still produce a value, so setup code stays inside the expression that uses it."
        left_label: "Python"
        left_chip: "python"
        left_code: |
          tmp = x + y
          if tmp > 0:
              result = tmp * scale
          else:
              result = 0
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let result = {
            let tmp = x + y;
            if tmp > 0 { tmp * scale } else { 0 }
          };

  - id: "workloads"
    theme: "paper"
    step: "03"
    label: "Showcase"
    title: "The same language, from first read to full workload."
    intro: "Einlang is most convincing when the same syntax appears in both small fragments and larger programs. These are good places to start."
    cards:
      - title: "A first read"
        text: "Start with the smallest examples to get the feel of the notation."
        links:
          - label: "examples/hello.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/hello.ein"
          - label: "examples/demos"
            url: "https://github.com/einlang/einlang/tree/main/examples/demos"
      - title: "Vision-style models"
        text: "Convolutional examples keep local structure legible instead of hiding it in layers of framework code."
        links:
          - label: "examples/mnist"
            url: "https://github.com/einlang/einlang/tree/main/examples/mnist"
          - label: "examples/mnist_quantized"
            url: "https://github.com/einlang/einlang/tree/main/examples/mnist_quantized"
      - title: "Attention-heavy programs"
        text: "DeiT and Whisper artifacts show how the notation holds up under denser workloads."
        links:
          - label: "examples/deit_tiny"
            url: "https://github.com/einlang/einlang/tree/main/examples/deit_tiny"
          - label: "examples/whisper_tiny"
            url: "https://github.com/einlang/einlang/tree/main/examples/whisper_tiny"
      - title: "Beyond standard ML"
        text: "Optimization, recurrence, and numerical examples show the same language in a wider setting."
        links:
          - label: "examples/optimization"
            url: "https://github.com/einlang/einlang/tree/main/examples/optimization"
          - label: "examples/ode"
            url: "https://github.com/einlang/einlang/tree/main/examples/ode"

  - id: "start"
    theme: "accent"
    step: "04"
    label: "Start"
    title: "Run one file, then keep going."
    intro: "A small example is enough to begin. From there, the examples and the reference docs open up the rest of the language."
    command_label: "Quick start"
    command: |
      python3 -m pip install "git+https://github.com/einlang/einlang.git"
      python3 -m einlang examples/hello.ein
    actions:
      - label: "Documentation"
        url: "https://github.com/einlang/einlang/blob/main/docs/README.md"
        variant: "secondary"
        icon: "doc"
      - label: "Reference"
        url: "https://github.com/einlang/einlang/blob/main/docs/reference.md"
        variant: "secondary"
        icon: "doc"
      - label: "Autodiff"
        url: "https://github.com/einlang/einlang/blob/main/docs/AUTODIFF_HIGHLIGHTS.md"
        variant: "primary"
        icon: "spark"
