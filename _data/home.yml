      - "Thesis: compiler and runtime details."

slides:
  - id: "premise"
    theme: "warm"
    step: "01"
    label: "Why"
    title: "Tensor code should still show the important structure."
    intro: "Too often, tensor programs disappear into helper calls, layer wrappers, and gradient machinery. Einlang keeps the axes, reductions, and derivatives on the page so the source still reads like the idea behind it."
    points:
      - title: "You can see the axes"
        text: "Indices and reductions are written directly instead of being hidden in strings or helper calls."
      - title: "You can see the derivative"
        text: "Gradient expressions live beside the original definitions, not in a separate autodiff API."
      - title: "You can keep one notation"
        text: "The same style carries from simple algebra to recurrences, numerics, and larger models."
    callout:
      label: "The payoff"
      text: "Programs get easier to inspect, easier to explain, and easier to trust."

  - id: "language"
    theme: "ink"
    step: "02"
    label: "Syntax"
    title: "Syntax features, side by side."
    intro: "This section is about syntax, not slogans. Each example shows one language feature in a more typical style and in Einlang, so you can see what the syntax keeps on the page."
    comparisons:
      - title: "Einstein notation"
        takeaway: "Indices and reductions are written directly instead of being hidden in a string or helper call."
        left_label: "NumPy / JAX"
        left_chip: "numpy"
        left_code: |
          y = np.einsum("bi,ci->bc", x, W) + bias
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let y[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      - title: "Where clauses"
        takeaway: "Index relations stay attached to the expression instead of being managed as loop bookkeeping."
        left_label: "Python loops"
        left_chip: "python"
        left_code: |
          for oh in range(H_out):
              for ow in range(W_out):
                  out[oh, ow] = sum(
                      inp[oh + kh, ow + kw] * kernel[kh, kw]
                      for kh in range(KH)
                      for kw in range(KW)
                  )
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let out[oh, ow] = sum[kh, kw](
            input[ih, iw] * kernel[kh, kw]
          ) where ih = oh + kh, iw = ow + kw;
      - title: "Autodiff syntax"
        takeaway: "The derivative is part of the program text, not a separate API wrapped around it."
        left_label: "JAX / framework style"
        left_chip: "jax"
        left_code: |
          def loss_fn(W):
              logits = x @ W.T + bias
              probs = jax.nn.softmax(logits)
              return -(target * jnp.log(probs)).sum()

          dloss_dW = jax.grad(loss_fn)(W)
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
          let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));
          let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
          let dloss_dW = @loss / @W;
      - title: "Fibonacci recurrence"
        takeaway: "The recurrence uses the same tested form as the repo examples: base cases first, then the recursive rule."
        left_label: "Python loop"
        left_chip: "python"
        left_code: |
          fib = np.zeros(11, dtype=int)
          fib[0] = 1
          fib[1] = 1
          for n in range(2, 11):
              fib[n] = fib[n - 1] + fib[n - 2]
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let fib[0] = 1;
          let fib[1] = 1;
          let fib[n in 2..11] = fib[n-1] + fib[n-2];
      - title: "Comprehensions and ranges"
        takeaway: "Generated arrays stay as expressions, and ranges are part of the syntax."
        left_label: "Python"
        left_chip: "python"
        left_code: |
          squares = [i * i for i in range(1, 10)]
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let squares = [i * i | i in 1..10];
      - title: "Block expressions"
        takeaway: "Multiple statements can still produce a value, so setup code stays inside the expression that uses it."
        left_label: "Python"
        left_chip: "python"
        left_code: |
          tmp = x + y
          if tmp > 0:
              result = tmp * scale
          else:
              result = 0
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let result = {
            let tmp = x + y;
            if tmp > 0 { tmp * scale } else { 0 }
          };

  - id: "read"
    theme: "paper"
    step: "03"
    label: "Read"
    title: "Choose the artifact that matches your question."
    intro: "Each document answers a different question: how to learn the notation, what the language-design argument is, how the implementation works, or how to run the code."
    cards:
      - title: "Book"
        text: "A seven-section book about explicit indices: named axes, index rules, dependency graphs, type contracts, compile-time autodiff, compiler transformations, and source-level contracts."
        links:
          - label: "Visible Dimensions"
            url: "https://einlang.github.io/einlang/book/"
      - title: "Paper"
        text: "The compact research argument for keeping indexed definitions, recurrence, and derivative requests in one source language."
        links:
          - label: "Paper PDF"
            url: "https://einlang.github.io/einlang/paper/einlang_paper.pdf"
      - title: "Thesis"
        text: "The fuller implementation writeup, including frontend identity, IR passes, recurrence analysis, autodiff lowering, runtimes, and tests."
        links:
          - label: "Thesis PDF"
            url: "https://einlang.github.io/einlang/thesis/einlang_thesis.pdf"
      - title: "Repository"
        text: "Use the repository for installation, commands, examples, and contribution pointers."
        links:
          - label: "README"
            url: "https://github.com/einlang/einlang/blob/main/README.md"
          - label: "Examples"
            url: "https://github.com/einlang/einlang/blob/main/examples/README.md"

  - id: "evidence"
    theme: "steel"
    step: "04"
    label: "Evidence"
    title: "What makes the claim concrete."
    intro: "The project is still experimental, but its claims are attached to an implementation: parser and IR passes, executable examples, tests, and generated research artifacts."
    cards:
      - title: "Source facts survive lowering"
        text: "The compiler keeps axes, ranges, recurrence dependencies, and derivative requests available until the pass that consumes each fact."
        links:
          - label: "Architecture"
            url: "https://github.com/einlang/einlang/blob/main/docs/ARCHITECTURE.md"
          - label: "Thesis report"
            url: "https://einlang.github.io/einlang/thesis/einlang_thesis.pdf"
      - title: "Examples cover the surface"
        text: "The repository includes small checks, recurrence suites, optimization examples, and model-shaped programs that stress the same notation."
        links:
          - label: "Examples guide"
            url: "https://github.com/einlang/einlang/blob/main/examples/README.md"
          - label: "Example tests"
            url: "https://github.com/einlang/einlang/tree/main/tests/examples"
      - title: "Dimensions are explicit"
        text: "The public book focuses on one claim across seven sections: named indices state tensor intent where shape-only code leaves it implicit."
        links:
          - label: "Visible Dimensions"
            url: "https://einlang.github.io/einlang/book/"
          - label: "Compiler blindness"
            url: "https://einlang.github.io/einlang/book/chapter-01-compiler-blindness.html"
      - title: "Limits are documented"
        text: "Current limits are part of the public story rather than hidden behind a polished demo."
        links:
          - label: "Paper limits"
            url: "https://einlang.github.io/einlang/paper/einlang_paper.pdf"
          - label: "Issue tracker"
            url: "https://github.com/einlang/einlang/issues"

