meta:
  description: "Einlang is a scientific programming language for tensor notation, recurrences, autodiff, and shape-checked numerical code."
  brand_tagline: "A research language for mathematical computing"

hero:
  eyebrow: "Scientific programming language"
  title: "Executable mathematics for tensors, recurrence, and autodiff."
  lead_intro: "Einlang is a compiler project for writing numerical programs in notation that stays close to the underlying math."
  lead_body: "Instead of translating equations into loop-heavy bookkeeping, you write indices, reductions, recurrence relations, and derivatives directly while the compiler checks shapes, infers ranges, and validates the program before execution."
  actions:
    - label: "Read getting started"
      url: "https://github.com/einlang/einlang/blob/main/docs/GETTING_STARTED.md"
      variant: "primary"
    - label: "Read the paper notes"
      url: "https://github.com/einlang/einlang/blob/main/docs/PAPER.md"
      variant: "secondary"
    - label: "Open repository"
      url: "https://github.com/einlang/einlang"
      variant: "secondary"
  stats:
    - value: "100+"
      label: "compiler and language tests for examples, stdlib, and integration behavior"
    - value: "ML + numerics"
      label: "same language model used across convolution, attention, ODEs, PDEs, and optimization"
    - value: "Compiler-native"
      label: "autodiff, shape analysis, and lowering live inside the compiler pipeline"
  ribbons:
    - "Einstein notation"
    - "Where clauses"
    - "Recurrence relations"
    - "Shape inference"
    - "Range analysis"
    - "Expression-first autodiff"
    - "MNIST to Whisper"
    - "NumPy backend today"
  panel:
    label: "core notation"
    code: |
      let C[i, j] = sum[k](A[i, k] * B[k, j]);

      let fib[0] = 0;
      let fib[1] = 1;
      let fib[n in 2..25] = fib[n - 1] + fib[n - 2];

      let y = sum[i](x[i] * x[i]);
      let dy_dx = @y / @x;

abstract:
  label: "Abstract"
  title: "The homepage should explain Einlang like a scientific project."
  intro: "Einlang is not trying to look like enterprise infrastructure. Its strength is that the repository already reads like an active compiler and numerical-computing experiment."
  points:
    - title: "Equation-first source"
      text: "The surface syntax keeps tensor indices, reductions, recurrences, and derivative expressions visible instead of lowering them into incidental control flow."
    - title: "Static analysis where it matters"
      text: "Shape checks, range reasoning, constraint validation, and IR validation make mathematical programs safer before runtime."
    - title: "One notation across domains"
      text: "The same core language spans linear algebra, differentiable programs, simulation, and model-like workloads without switching to a separate DSL."

capabilities:
  label: "Compiler Scope"
  title: "What the compiler is actually doing."
  intro: "This page should make the analysis pipeline visible because that is a large part of the project's credibility."
  items:
