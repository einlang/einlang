hero:
  deck_label: "Einlang"
  eyebrow: "Explicit indices, in-language autodiff, and a first-run path that gets to the point quickly."
  title: "Tensor math that stays legible from first example to real workload."
  summary: "A first visit should not require framework lore or a scavenger hunt. Einlang keeps indices, reductions, recurrences, and derivatives in the source, then backs that up with runnable examples from tiny autodiff demos to MNIST, DeiT, and Whisper-style programs."
  actions:
    - label: "Open repository"
      url: "https://github.com/einlang/einlang"
      variant: "primary"
      icon: "repo"
    - label: "View visitor path"
      url: "#path"
      variant: "secondary"
      icon: "spark"
    - label: "See the syntax"
      url: "#language"
      variant: "secondary"
      icon: "code"
  signal_strip:
    - "Indices"
    - "Autodiff syntax"
    - "Recurrences"
    - "Runnable examples"
    - "CI tested"
  spotlight:
    label: "60-second taste"
    code: |
      let x = 1.0;
      let y = x * x + 3.0 * x;
      let dy_dx = @y / @x;
      print(dy_dx);
  status:
    title: "What keeps people around"
    items:
      - "The derivative request is part of the language."
      - "The first highlighted examples run from the repo root."
      - "The same notation shows up again in larger examples."

slides:
  - id: "premise"
    theme: "warm"
    step: "01"
    label: "Why"
    title: "Tensor code should still show the important structure."
    intro: "Too often, tensor programs disappear into helper calls, layer wrappers, and gradient machinery. Einlang keeps the axes, reductions, and derivatives on the page so the source still reads like the idea behind it."
    points:
      - title: "You can see the axes"
        text: "Indices and reductions are written directly instead of being hidden in strings or helper calls."
      - title: "You can see the derivative"
        text: "Gradient expressions live beside the original definitions, not in a separate autodiff API."
      - title: "You can keep one notation"
        text: "The same style carries from simple algebra to recurrences, numerics, and larger models."
    callout:
      label: "The payoff"
      text: "Programs get easier to inspect, easier to explain, and easier to trust."

  - id: "language"
    theme: "ink"
    step: "02"
    label: "Syntax"
    title: "Syntax features, side by side."
    intro: "This section is about syntax, not slogans. Each example shows one language feature in a more typical style and in Einlang, so you can see what the syntax keeps on the page."
    comparisons:
      - title: "Einstein notation"
        takeaway: "Indices and reductions are written directly instead of being hidden in a string or helper call."
        left_label: "NumPy / JAX"
        left_chip: "numpy"
        left_code: |
          y = np.einsum("bi,ci->bc", x, W) + bias
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let y[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
      - title: "Where clauses"
        takeaway: "Index relations stay attached to the expression instead of being managed as loop bookkeeping."
        left_label: "Python loops"
        left_chip: "python"
        left_code: |
          for oh in range(H_out):
              for ow in range(W_out):
                  out[oh, ow] = sum(
                      inp[oh + kh, ow + kw] * kernel[kh, kw]
                      for kh in range(KH)
                      for kw in range(KW)
                  )
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let out[oh, ow] = sum[kh, kw](
            input[ih, iw] * kernel[kh, kw]
          ) where ih = oh + kh, iw = ow + kw;
      - title: "Autodiff syntax"
        takeaway: "The derivative is part of the program text, not a separate API wrapped around it."
        left_label: "JAX / framework style"
        left_chip: "jax"
        left_code: |
          def loss_fn(W):
              logits = x @ W.T + bias
              probs = jax.nn.softmax(logits)
              return -(target * jnp.log(probs)).sum()

          dloss_dW = jax.grad(loss_fn)(W)
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let logits[b, c] = sum[i](x[b, i] * W[c, i]) + bias[c];
          let probs[b, c] = exp(logits[b, c]) / sum[k](exp(logits[b, k]));
          let loss = -sum[b, c](target[b, c] * log(probs[b, c]));
          let dloss_dW = @loss / @W;
      - title: "Fibonacci recurrence"
        takeaway: "The recurrence uses the same tested form as the repo examples: base cases first, then the recursive rule."
        left_label: "Python loop"
        left_chip: "python"
        left_code: |
          fib = np.zeros(11, dtype=int)
          fib[0] = 1
          fib[1] = 1
          for n in range(2, 11):
              fib[n] = fib[n - 1] + fib[n - 2]
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let fib[0] = 1;
          let fib[1] = 1;
          let fib[n in 2..11] = fib[n-1] + fib[n-2];
      - title: "Comprehensions and ranges"
        takeaway: "Generated arrays stay as expressions, and ranges are part of the syntax."
        left_label: "Python"
        left_chip: "python"
        left_code: |
          squares = [i * i for i in range(1, 10)]
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let squares = [i * i | i in 1..10];
      - title: "Block expressions"
        takeaway: "Multiple statements can still produce a value, so setup code stays inside the expression that uses it."
        left_label: "Python"
        left_chip: "python"
        left_code: |
          tmp = x + y
          if tmp > 0:
              result = tmp * scale
          else:
              result = 0
        right_label: "Einlang"
        right_chip: "ein"
        right_code: |
          let result = {
            let tmp = x + y;
            if tmp > 0 { tmp * scale } else { 0 }
          };

  - id: "path"
    theme: "paper"
    step: "03"
    label: "Path"
    title: "A better first visit is time-boxed."
    intro: "Instead of dropping visitors into dozens of directories, the best entry path is staged. Start small, see the differentiator quickly, then branch into the workloads that match your interests."
    cards:
      - title: "30 seconds"
        text: "Confirm the install with `hello.ein`, then immediately see the differentiator with `autodiff_small.ein`."
        links:
          - label: "examples/hello.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/hello.ein"
          - label: "examples/autodiff_small.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/autodiff_small.ein"
      - title: "5 minutes"
        text: "Use matrix notation and a real fitting example to see that the syntax still holds up outside the toy stage."
        links:
          - label: "examples/demos/matrix_operations.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/demos/matrix_operations.ein"
          - label: "examples/applications/linear_regression_autodiff.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/applications/linear_regression_autodiff.ein"
      - title: "30 minutes"
        text: "Branch into recurrences, numerics, or the MNIST inference showcase once the syntax feels natural."
        links:
          - label: "examples/recurrence/recurrence_suite.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/recurrence/recurrence_suite.ein"
          - label: "examples/ode/ode_suite.ein"
            url: "https://github.com/einlang/einlang/blob/main/examples/ode/ode_suite.ein"
          - label: "examples/mnist"
            url: "https://github.com/einlang/einlang/tree/main/examples/mnist"
      - title: "After that"
        text: "Use the example guide once you want the heavier showcases, larger models, or directory-local training examples."
        links:
          - label: "examples/README"
            url: "https://github.com/einlang/einlang/blob/main/examples/README.md"
          - label: "examples/deit_tiny"
            url: "https://github.com/einlang/einlang/tree/main/examples/deit_tiny"
          - label: "examples/whisper_tiny"
            url: "https://github.com/einlang/einlang/tree/main/examples/whisper_tiny"

  - id: "trust"
    theme: "steel"
    step: "04"
    label: "Trust"
    title: "Show the proof, not just the pitch."
    intro: "Visitors stay when a repo makes it easy to verify its claims. The front door should say what is special, point to a clean path, and make the validation work visible."
    cards:
      - title: "Runnable front door"
        text: "The highlighted README path stays root-run and low-friction instead of immediately requiring working-directory tricks."
        links:
          - label: "README"
            url: "https://github.com/einlang/einlang/blob/main/README.md"
          - label: "Getting started"
            url: "https://github.com/einlang/einlang/blob/main/docs/GETTING_STARTED.md"
      - title: "Regression-tested examples"
        text: "README examples have contract tests, while larger demos and autodiff/model showcases have their own dedicated suites."
        links:
          - label: "tests/examples/test_readme_examples.py"
            url: "https://github.com/einlang/einlang/blob/main/tests/examples/test_readme_examples.py"
          - label: "tests/examples/test_demo.py"
            url: "https://github.com/einlang/einlang/blob/main/tests/examples/test_demo.py"
          - label: "tests/examples/test_mnist_autodiff.py"
            url: "https://github.com/einlang/einlang/blob/main/tests/examples/test_mnist_autodiff.py"
      - title: "CI keeps watch"
        text: "GitHub Actions runs the test suite across multiple Python versions so breakage in examples gets caught early."
        links:
          - label: ".github/workflows/tests.yml"
            url: "https://github.com/einlang/einlang/blob/main/.github/workflows/tests.yml"
      - title: "Curated next steps"
        text: "The docs and examples are split by job: quick start, examples map, reference docs, and deeper motivation."
        links:
          - label: "docs/README"
            url: "https://github.com/einlang/einlang/blob/main/docs/README.md"
          - label: "examples/README"
            url: "https://github.com/einlang/einlang/blob/main/examples/README.md"
      - title: "Research writeups"
        text: "The paper states the compact language-design argument; the thesis-form report documents the compiler and runtime algorithms."
        links:
          - label: "Paper PDF"
            url: "/einlang/paper/einlang_paper.pdf"
          - label: "Thesis PDF"
            url: "/einlang/thesis/einlang_thesis.pdf"

  - id: "start"
    theme: "accent"
    step: "05"
    label: "Start"
    title: "Run one file, then keep going."
    intro: "A small example is enough to begin. From there, the examples guide, reference docs, and heavier showcases open up the rest of the language."
    callout:
      label: "Advanced note"
      text: "Some training-oriented or directory-local examples use local Python helper modules or extra setup. Their directory README gives the exact command when that matters."
    timeline:
      - stage: "30 sec"
        text: "Install and run `examples/hello.ein`."
      - stage: "5 min"
        text: "Run `examples/autodiff_small.ein` and `examples/demos/matrix_operations.ein`."
      - stage: "30 min"
        text: "Branch into `linear_regression_autodiff.ein`, `recurrence_suite.ein`, `ode_suite.ein`, or `mnist/main.ein`."
    command_label: "Quick start"
    command: |
      git clone https://github.com/einlang/einlang.git
      cd einlang
      python3 -m pip install -e .
      python3 -m einlang examples/hello.ein
    actions:
      - label: "Docs index"
        url: "https://github.com/einlang/einlang/blob/main/docs/README.md"
        variant: "secondary"
        icon: "doc"
      - label: "Examples guide"
        url: "https://github.com/einlang/einlang/blob/main/examples/README.md"
        variant: "secondary"
        icon: "doc"
      - label: "Autodiff"
        url: "https://github.com/einlang/einlang/blob/main/docs/AUTODIFF.md"
        variant: "primary"
        icon: "spark"
