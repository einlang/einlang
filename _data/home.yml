cta:
  label: "Run It"
  title: "Clone the repo, install the package, and run an example."
  intro: "The page should end with the simplest real workflow."
  command: |
    git clone https://github.com/einlang/einlang.git
    cd einlang
    pip install -e .
    python3 -m einlang examples/mnist/main.ein
  actions:
    - label: "Open examples"
      url: "https://github.com/einlang/einlang/tree/main/examples"
      variant: "primary"
    - label: "Read docs index"
      url: "https://github.com/einlang/einlang/blob/main/docs/README.md"
      variant: "secondary"
  note: "If you want a smaller first run, start with examples/hello.ein."
