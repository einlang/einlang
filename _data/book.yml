- title: "Chapter 1: Data and Indices"
  url: /book/chapter-1-data-and-indices.html
  short_title: 1. Data and Indices
  kind: chapter
  section: Chapters
  eyebrow: Chapter 1
  prerequisites:
    - Comfort reading algebraic notation with subscripts.
    - Familiarity with variables, functions, and arrays in a general-purpose language.
  objectives:
    - Explain why immutable names are the first useful abstraction in Einlang.
    - Read indexed bindings as families of scalar equations rather than loops.
    - Infer rank and shape from visible index structure.
    - Predict how fixing indices produces slices, subtensors, and scalars.
  key_terms:
    - binding
    - index
    - rank
    - shape
    - slice
- title: "Chapter 2: Reduction"
  url: /book/chapter-2-reduction.html
  short_title: 2. Reduction
  kind: chapter
  section: Chapters
  eyebrow: Chapter 2
  prerequisites:
    - Chapter 1, especially indexed bindings and visible rank.
  objectives:
    - Distinguish surviving indices from consumed indices in a reduction.
    - Read dot products and matrix multiplication directly from index structure.
    - Explain why explicit reductions are easier to check and optimize than implicit summation.
    - Use guards and bounded reductions to describe selective aggregation.
  key_terms:
    - reduction
    - contraction
    - identity value
    - guarded reduction
    - pooling
- title: "Chapter 3: Broadcasting and Transformations"
  url: /book/chapter-3-broadcasting-and-transformations.html
  short_title: 3. Broadcasting
  kind: chapter
  section: Chapters
  eyebrow: Chapter 3
  prerequisites:
    - Chapters 1 and 2.
    - Basic familiarity with matrix and tensor notation.
  objectives:
    - Explain broadcasting as non-dependence on a missing output index.
    - Read transposes and permutations as axis maps rather than copying rituals.
    - Use named rest patterns to describe rank-polymorphic tensor families.
    - Interpret convolution as index arithmetic plus reduction.
  key_terms:
    - broadcasting
    - permutation
    - rest pattern
    - convolution
    - affine index expression
- title: "Chapter 4: Automatic Differentiation"
  url: /book/chapter-4-automatic-differentiation.html
  short_title: 4. Autodiff
  kind: chapter
  section: Chapters
  eyebrow: Chapter 4
  prerequisites:
    - Chapters 1 through 3.
    - Introductory calculus, especially derivatives and the chain rule.
  objectives:
    - Explain why derivative requests in Einlang are expressions over named bindings.
    - Distinguish scalar gradients, tensor-shaped sensitivities, and Jacobian-like values.
    - Trace the chain rule through named intermediate bindings.
    - Describe gradient descent as recurrence instead of mutation.
  key_terms:
    - autodiff
    - gradient
    - Jacobian
    - chain rule
    - higher-order derivative
- title: "Chapter 5: Recurrence and Time"
  url: /book/chapter-5-recurrence-and-time.html
  short_title: 5. Recurrence
  kind: chapter
  section: Chapters
  eyebrow: Chapter 5
  prerequisites:
    - Chapters 1 through 4.
    - Familiarity with sequences, recurrence relations, or dynamic programming.
  objectives:
    - Read recurrence clauses as dependency relations over time-indexed values.
    - Explain how dependency offsets constrain legal evaluation schedules.
    - Predict when rolling storage windows are possible.
    - Connect recurrence syntax to RNNs, dynamic programming, and streaming state.
  key_terms:
    - recurrence
    - lookback
    - schedule
    - dynamic programming
    - rolling window
- title: "Chapter 6: Living With Python"
  url: /book/chapter-6-living-with-python.html
  short_title: 6. Python
  kind: chapter
  section: Chapters
  eyebrow: Chapter 6
  prerequisites:
    - Chapters 1 through 5.
    - Basic Python and NumPy literacy.
  objectives:
    - Identify which responsibilities belong naturally in Python and which belong in Einlang.
    - Use `print` and explicit casts as boundary tools for debugging and safety.
    - Describe how shaped casts turn dynamic external values into checked tensor contracts.
    - Read end-to-end interop examples such as MNIST-style workflows.
  key_terms:
    - interop
    - cast
    - boundary
    - observation
    - host ecosystem
- title: "Chapter 7: The Small Core and Its Boundaries"
  url: /book/chapter-7-small-core-and-boundaries.html
  short_title: 7. Boundaries
  kind: chapter
  section: Chapters
  eyebrow: Chapter 7
  prerequisites:
    - The full book, especially recurrence and Python interop.
  objectives:
    - Explain why a small tensor language can be stronger than a universal one.
    - Distinguish local control flow from general-purpose program control.
    - Compare recurrence with mutation as models of state.
    - Evaluate trade-offs between focus, analyzability, and convenience.
  key_terms:
    - small core
    - mutation
    - control flow
    - analyzability
    - domain language
