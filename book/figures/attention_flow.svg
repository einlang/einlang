<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 254" width="100%" height="100%">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#4A5053"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .body   { font-size: 10px; fill: #262626; }
  .small  { font-size: 8px; fill: #5C6063; }
  .accent { font-size: 8.5px; fill: #1F6C74; font-weight: bold; }
  .label  { font-size: 7.5px; fill: #5C6063; }
  .bf     { font-weight: bold; }
  .it     { font-style: italic; }
  .sub    { font-size: 0.75em; baseline-shift: sub; }
</style>

<!-- Input x -->
<g transform="translate(24,80)">
  <rect x="0" y="0" width="72" height="40" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <text x="36" y="24" class="body" text-anchor="middle"><tspan class="bf">x</tspan></text>
  <text x="36" y="-8" class="accent" text-anchor="middle"><tspan class="bf">seq</tspan></text>
  <text x="-20" y="20" class="label" text-anchor="end" transform="rotate(-90,-20,20)">d<tspan class="sub">model</tspan></text>
</g>

<!-- Q, K, V -->
<g transform="translate(136,16)">
  <rect x="0" y="0" width="56" height="40" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <text x="28" y="24" class="body" text-anchor="middle"><tspan class="bf">Q</tspan></text>
  <text x="28" y="-8" class="accent" text-anchor="middle"><tspan class="bf">seq</tspan><tspan class="sub">q</tspan></text>
  <text x="-20" y="20" class="label" text-anchor="end" transform="rotate(-90,-20,20)">d<tspan class="sub">head</tspan></text>
</g>

<g transform="translate(136,72)">
  <rect x="0" y="0" width="56" height="40" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <text x="28" y="24" class="body" text-anchor="middle"><tspan class="bf">K</tspan></text>
  <text x="28" y="-8" class="accent" text-anchor="middle"><tspan class="bf">seq</tspan><tspan class="sub">k</tspan></text>
  <text x="-20" y="20" class="label" text-anchor="end" transform="rotate(-90,-20,20)">d<tspan class="sub">head</tspan></text>
</g>

<g transform="translate(136,128)">
  <rect x="0" y="0" width="56" height="40" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <text x="28" y="24" class="body" text-anchor="middle"><tspan class="bf">V</tspan></text>
  <text x="28" y="-8" class="accent" text-anchor="middle"><tspan class="bf">seq</tspan><tspan class="sub">k</tspan></text>
  <text x="-20" y="20" class="label" text-anchor="end" transform="rotate(-90,-20,20)">d<tspan class="sub">head</tspan></text>
</g>

<!-- Arrows: x → Q, K, V -->
<line x1="99" y1="100" x2="132" y2="36" stroke="#4A5053" stroke-width="0.6" marker-end="url(#arr)" stroke-dasharray="3,3"/>
<line x1="99" y1="100" x2="132" y2="92" stroke="#4A5053" stroke-width="0.6" marker-end="url(#arr)" stroke-dasharray="3,3"/>
<line x1="99" y1="100" x2="132" y2="148" stroke="#4A5053" stroke-width="0.6" marker-end="url(#arr)" stroke-dasharray="3,3"/>

<!-- Scores QK^T -->
<g transform="translate(234,42)">
  <rect x="0" y="0" width="64" height="72" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <text x="32" y="40" class="body" text-anchor="middle"><tspan class="bf">QK</tspan><tspan class="sub">⊤</tspan></text>
  <text x="32" y="-8" class="accent" text-anchor="middle"><tspan class="bf">seq</tspan><tspan class="sub">q</tspan></text>
  <text x="-20" y="36" class="accent" text-anchor="end" transform="rotate(-90,-20,36)"><tspan class="bf">seq</tspan><tspan class="sub">k</tspan></text>
</g>

<!-- Arrows Q,K → scores -->
<line x1="195" y1="36" x2="230" y2="64" stroke="#4A5053" stroke-width="0.6" marker-end="url(#arr)" stroke-dasharray="3,3"/>
<line x1="195" y1="92" x2="230" y2="92" stroke="#4A5053" stroke-width="0.6" marker-end="url(#arr)" stroke-dasharray="3,3"/>

<!-- Softmax label -->
<text x="335" y="82" class="accent" text-anchor="middle">softmax[<tspan class="bf">seq</tspan><tspan class="sub">k</tspan>]</text>

<!-- Output O -->
<g transform="translate(368,80)">
  <rect x="0" y="0" width="56" height="40" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <text x="28" y="24" class="body" text-anchor="middle"><tspan class="bf">O</tspan></text>
  <text x="28" y="-8" class="accent" text-anchor="middle"><tspan class="bf">seq</tspan><tspan class="sub">q</tspan></text>
  <text x="-20" y="20" class="label" text-anchor="end" transform="rotate(-90,-20,20)">d<tspan class="sub">head</tspan></text>
</g>

<!-- Arrow scores → O -->
<line x1="301" y1="78" x2="364" y2="100" stroke="#4A5053" stroke-width="0.6" marker-end="url(#arr)" stroke-dasharray="3,3"/>

<!-- Arrow V → O -->
<path d="M195,148 C273,190 316,180 364,100" stroke="#4A5053" stroke-width="0.6" fill="none" marker-end="url(#arr)" stroke-dasharray="3,3"/>

<!-- Bottom text -->
<line x1="10" y1="198" x2="450" y2="198" stroke="#BFC3C5" stroke-width="0.3"/>
<text x="230" y="220" class="body" text-anchor="middle">Self-attention: <tspan class="bf">seq</tspan><tspan class="sub">q</tspan> = <tspan class="bf">seq</tspan><tspan class="sub">k</tspan>.  Cross-attention: <tspan class="bf">seq</tspan><tspan class="sub">q</tspan> ≠ <tspan class="bf">seq</tspan><tspan class="sub">k</tspan>.  The names tell you which is which.</text>
</svg>
