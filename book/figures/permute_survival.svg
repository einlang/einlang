<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" height="100%">
<defs>
  <marker id="arrGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#4a4a4a"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .title  { font-size: 12px; fill: #262626; font-weight: bold; }
  .body   { font-size: 10px; fill: #262626; }
  .small  { font-size: 8.5px; fill: #262626; }
  .ok     { font-size: 9px; fill: #1f6d7a; font-weight: bold; }
  .warn   { font-size: 9px; fill: #b04246; font-weight: bold; }
  .label  { font-size: 8px; fill: #5c5c5c; font-style: italic; }
  .dim    { font-size: 9.5px; fill: #262626; font-weight: bold; }
  .dimOk  { font-size: 9.5px; fill: #1f6d7a; font-weight: bold; }
  .dimBug { font-size: 9.5px; fill: #b04246; font-weight: bold; }
  .pos    { font-size: 7px; fill: #8a8a8a; }
  .bf     { font-weight: bold; }
  .it     { font-style: italic; }
  .sub    { font-size: 0.75em; baseline-shift: sub; font-style: italic; }
</style>

<!-- Column headers -->
<text x="185" y="22" class="title" text-anchor="middle">Positional</text>
<text x="385" y="22" class="title" text-anchor="middle">Named</text>
<text x="185" y="38" class="small" text-anchor="middle">permute(0, 3, 1, 2)</text>
<text x="385" y="38" class="small" text-anchor="middle"><tspan class="bf">y</tspan>[<tspan class="it">b</tspan>, <tspan class="it">c</tspan>, <tspan class="it">h</tspan>, <tspan class="it">w</tspan>] = <tspan class="bf">x</tspan>[<tspan class="it">b</tspan>, <tspan class="it">h</tspan>, <tspan class="it">w</tspan>, <tspan class="it">c</tspan>]</text>

<!-- Row labels -->
<text x="58" y="74" class="label" text-anchor="end">Original</text>

<!-- ===== Positional — Original ===== -->
<g transform="translate(75,58)">
  <rect x="0" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="22" y="15" class="dim" text-anchor="middle">B</text><text x="22" y="21" class="pos" text-anchor="middle">0</text>
  <rect x="50" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="72" y="15" class="dim" text-anchor="middle">H</text><text x="72" y="21" class="pos" text-anchor="middle">1</text>
  <rect x="100" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="122" y="15" class="dim" text-anchor="middle">W</text><text x="122" y="21" class="pos" text-anchor="middle">2</text>
  <rect x="150" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="172" y="15" class="dim" text-anchor="middle">C</text><text x="172" y="21" class="pos" text-anchor="middle">3</text>

  <!-- Arrows: B→B(0), H→C(1), W→H(2), C→W(3) showing permute(0,3,1,2) -->
  <line x1="22" y1="25" x2="22" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="72" y1="25" x2="122" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="122" y1="25" x2="172" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="172" y1="25" x2="72" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>

  <!-- Result row -->
  <rect x="0" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="22" y="63" class="dimOk" text-anchor="middle">B</text>
  <rect x="50" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="72" y="63" class="dimOk" text-anchor="middle">C</text>
  <rect x="100" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="122" y="63" class="dimOk" text-anchor="middle">H</text>
  <rect x="150" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="172" y="63" class="dimOk" text-anchor="middle">W</text>

  <text x="97" y="88" class="ok" text-anchor="middle">OK</text>
</g>

<!-- ===== Named — Original ===== -->
<g transform="translate(295,58)">
  <rect x="0" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="22" y="16" class="dim" text-anchor="middle">B</text>
  <rect x="50" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="72" y="16" class="dim" text-anchor="middle">H</text>
  <rect x="100" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="122" y="16" class="dim" text-anchor="middle">W</text>
  <rect x="150" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="172" y="16" class="dim" text-anchor="middle">C</text>

  <line x1="22" y1="25" x2="22" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="72" y1="25" x2="122" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="122" y1="25" x2="172" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="172" y1="25" x2="72" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>

  <rect x="0" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="22" y="63" class="dimOk" text-anchor="middle">B</text>
  <rect x="50" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="72" y="63" class="dimOk" text-anchor="middle">C</text>
  <rect x="100" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="122" y="63" class="dimOk" text-anchor="middle">H</text>
  <rect x="150" y="48" width="44" height="24" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="172" y="63" class="dimOk" text-anchor="middle">W</text>

  <text x="97" y="88" class="ok" text-anchor="middle">OK</text>
</g>

<line x1="58" y1="160" x2="542" y2="160" stroke="#c4c4c4" stroke-width="0.3"/>

<text x="58" y="188" class="label" text-anchor="end">After swap</text>

<!-- ===== Positional — After swap ===== -->
<g transform="translate(75,172)">
  <rect x="0" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="22" y="15" class="dim" text-anchor="middle">B</text><text x="22" y="21" class="pos" text-anchor="middle">0</text>
  <rect x="50" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="72" y="15" class="dim" text-anchor="middle">W</text><text x="72" y="21" class="pos" text-anchor="middle">1</text>
  <rect x="100" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="122" y="15" class="dim" text-anchor="middle">H</text><text x="122" y="21" class="pos" text-anchor="middle">2</text>
  <rect x="150" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="172" y="15" class="dim" text-anchor="middle">C</text><text x="172" y="21" class="pos" text-anchor="middle">3</text>

  <!-- After swap, positional: same arrows but wrong mapping -->
  <line x1="22" y1="25" x2="22" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="72" y1="25" x2="122" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="122" y1="25" x2="172" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>
  <line x1="172" y1="25" x2="72" y2="46" stroke="#4a4a4a" stroke-width="0.6" marker-end="url(#arrGray)" stroke-dasharray="3,3"/>

  <rect x="0" y="48" width="44" height="24" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="22" y="63" class="dimBug" text-anchor="middle">B</text>
  <rect x="50" y="48" width="44" height="24" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="72" y="63" class="dimBug" text-anchor="middle">C</text>
  <rect x="100" y="48" width="44" height="24" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="122" y="63" class="dimBug" text-anchor="middle">W</text>
  <rect x="150" y="48" width="44" height="24" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="172" y="63" class="dimBug" text-anchor="middle">H</text>

  <text x="97" y="88" class="warn" text-anchor="middle">Bug</text>
</g>

<!-- ===== Named — After swap ===== -->
<g transform="translate(295,172)">
  <rect x="0" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="22" y="16" class="dim" text-anchor="middle">B</text>
  <rect x="50" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="72" y="16" class="dim" text-anchor="middle">W</text>
  <rect x="100" y="0" width="44" height="24" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
