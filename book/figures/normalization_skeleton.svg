<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 316" width="100%" height="100%">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#4a4a4a"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .title  { font-size: 12px; fill: #262626; font-weight: bold; }
  .body   { font-size: 10px; fill: #262626; }
  .small  { font-size: 8.5px; fill: #262626; }
  .accent { font-size: 8.5px; fill: #1f6d7a; font-weight: bold; }
  .warn   { font-size: 8.5px; fill: #b04246; font-weight: bold; }
  .label  { font-size: 8px; fill: #5c5c5c; }
  .hdr    { font-size: 8px; fill: #262626; font-weight: bold; letter-spacing: 0.3px; }
  .it     { font-style: italic; }
  .bf     { font-weight: bold; }
</style>

<!-- Title -->
<text x="260" y="20" class="title" text-anchor="middle">One skeleton, four names</text>
<text x="260" y="38" class="small" text-anchor="middle">The same reduce–broadcast–elementwise–scale template, filled in four different ways.</text>

<!-- Column headers — aligned to box centers below -->
<!-- Box centers: 98, 162, 218, 274, 350, 432 -->
<text x="98"  y="56" class="hdr" text-anchor="middle">Input</text>
<text x="162" y="56" class="hdr" text-anchor="middle">Reduced</text>
<text x="218" y="56" class="hdr" text-anchor="middle">Stat</text>
<text x="274" y="56" class="hdr" text-anchor="middle">Broadcasts</text>
<text x="350" y="56" class="hdr" text-anchor="middle">Scale + shift</text>
<text x="432" y="56" class="hdr" text-anchor="middle">Output</text>

<line x1="68" y1="62" x2="460" y2="62" stroke="#c4c4c4" stroke-width="0.3"/>

<!-- Row boxes:
  Col 1 (Input):      x=68,  w=60, center=98
  Col 2 (Reduced):    x=140, w=44, center=162
  Col 3 (Stat):       x=196, w=44, center=218
  Col 4 (Broadcasts): x=252, w=44, center=274
  Col 5 (Scale+shift):x=308, w=84, center=350
  Col 6 (Output):     x=404, w=56, center=432
-->

<!-- LayerNorm -->
<g transform="translate(0, 72)">
  <text x="58" y="17" class="label" text-anchor="end">LayerNorm</text>

  <rect x="68"  y="0" width="60" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="98"  y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="bf">f</tspan></text>

  <rect x="140" y="0" width="44" height="26" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="162" y="17" class="warn" text-anchor="middle"><tspan class="bf">f</tspan></text>

  <rect x="196" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="218" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan></text>

  <rect x="252" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="274" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan></text>

  <rect x="308" y="0" width="84" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="350" y="17" class="small" text-anchor="middle">* <tspan class="bf">γ</tspan>[<tspan class="bf">f</tspan>] + <tspan class="bf">β</tspan>[<tspan class="bf">f</tspan>]</text>

  <rect x="404" y="0" width="56" height="26" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="432" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="bf">f</tspan></text>
</g>

<!-- RMSNorm -->
<g transform="translate(0, 108)">
  <text x="58" y="17" class="label" text-anchor="end">RMSNorm</text>

  <rect x="68"  y="0" width="60" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="98"  y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="bf">f</tspan></text>

  <rect x="140" y="0" width="44" height="26" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="162" y="17" class="warn" text-anchor="middle"><tspan class="bf">f</tspan></text>

  <rect x="196" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="218" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan></text>

  <rect x="252" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="274" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan></text>

  <rect x="308" y="0" width="84" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="350" y="17" class="small" text-anchor="middle">* <tspan class="bf">γ</tspan>[<tspan class="bf">f</tspan>]</text>

  <rect x="404" y="0" width="56" height="26" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="432" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="bf">f</tspan></text>
</g>

<!-- GroupNorm -->
<g transform="translate(0, 144)">
  <text x="58" y="17" class="label" text-anchor="end">GroupNorm</text>

  <rect x="68"  y="0" width="60" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="98"  y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>,<tspan class="bf">g</tspan>,<tspan class="bf">c</tspan>,<tspan class="it">..spatial</tspan></text>

  <rect x="140" y="0" width="44" height="26" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="162" y="17" class="warn" text-anchor="middle"><tspan class="bf">c</tspan>, <tspan class="it">..spatial</tspan></text>

  <rect x="196" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="218" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="bf">g</tspan></text>

  <rect x="252" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="274" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="it">..spatial</tspan></text>

  <rect x="308" y="0" width="84" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="350" y="17" class="small" text-anchor="middle">* <tspan class="bf">γ</tspan>[<tspan class="bf">g</tspan>,<tspan class="bf">c</tspan>] + <tspan class="bf">β</tspan>[<tspan class="bf">g</tspan>,<tspan class="bf">c</tspan>]</text>

  <rect x="404" y="0" width="56" height="26" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="432" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>,<tspan class="bf">g</tspan>,<tspan class="bf">c</tspan>,<tspan class="it">..spatial</tspan></text>
</g>

<!-- InstanceNorm -->
<g transform="translate(0, 180)">
  <text x="58" y="17" class="label" text-anchor="end">InstanceNorm</text>

  <rect x="68"  y="0" width="60" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="98"  y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>,<tspan class="bf">c</tspan>,<tspan class="it">..spatial</tspan></text>

  <rect x="140" y="0" width="44" height="26" fill="#faf4f4" stroke="#b04246" stroke-width="0.5"/>
  <text x="162" y="17" class="warn" text-anchor="middle"><tspan class="it">..spatial</tspan></text>

  <rect x="196" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="218" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="bf">c</tspan></text>

  <rect x="252" y="0" width="44" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="274" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>, <tspan class="it">..spatial</tspan></text>

  <rect x="308" y="0" width="84" height="26" fill="#ffffff" stroke="#262626" stroke-width="0.5"/>
  <text x="350" y="17" class="small" text-anchor="middle">* <tspan class="bf">γ</tspan>[<tspan class="bf">c</tspan>] + <tspan class="bf">β</tspan>[<tspan class="bf">c</tspan>]</text>

  <rect x="404" y="0" width="56" height="26" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="432" y="17" class="small" text-anchor="middle"><tspan class="it">..batch</tspan>,<tspan class="bf">c</tspan>,<tspan class="it">..spatial</tspan></text>
</g>

<!-- Bottom -->
<line x1="20" y1="232" x2="500" y2="232" stroke="#c4c4c4" stroke-width="0.3"/>
<text x="260" y="254" class="body" text-anchor="middle">Read across any row: the same columns, the same stages.</text>
<text x="260" y="272" class="body" text-anchor="middle">Only the coordinate names change — and the names say <tspan class="it">what</tspan>, not <tspan class="it">where</tspan>.</text>
<text x="260" y="294" class="small" text-anchor="middle">In positional code: <tspan class="bf">dim=(-1,)</tspan>, <tspan class="bf">dim=(-1,)</tspan>, <tspan class="bf">dim=(2,3,4)</tspan>, <tspan class="bf">dim=(2,3)</tspan> — four integer tuples, no shared structure visible.</text>
</svg>
