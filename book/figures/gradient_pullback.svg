<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 370" width="100%" height="100%">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#4A5053"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .title { font-size: 11px; fill: #262626; font-weight: bold; }
  .body  { font-size: 10px; fill: #262626; }
  .small { font-size: 8.5px; fill: #262626; }
  .accent{ font-size: 8.5px; fill: #1F6C74; font-weight: bold; }
  .label { font-size: 7.5px; fill: #5C6063; }
  .formula{font-size: 10px; fill: #262626; }
  .set   { font-size: 9px; fill: #262626; font-weight: bold; }
  .setBg { font-size: 9px; fill: #1F6C74; font-weight: bold; }
  .bf    { font-weight: bold; }
  .it    { font-style: italic; }
  .sub   { font-size: 0.8em; font-style: italic; }
</style>

<!-- Forward section -->
<text x="230" y="22" class="title" text-anchor="middle">Forward: <tspan class="bf">C</tspan>[<tspan class="it">i</tspan>, <tspan class="it">j</tspan>] = &#931;<tspan class="sub">k</tspan> <tspan class="bf">A</tspan>[<tspan class="it">i</tspan>, <tspan class="it">k</tspan>] &#183; <tspan class="bf">B</tspan>[<tspan class="it">k</tspan>, <tspan class="it">j</tspan>]</text>
<text x="230" y="40" class="label" text-anchor="middle">Coordinate sets</text>

<g transform="translate(58, 50)">
  <rect x="0" y="0" width="104" height="34" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="52" y="21" class="set" text-anchor="middle"><tspan class="bf">A</tspan> : {<tspan class="it">i</tspan>, <tspan class="it">k</tspan>}</text>

  <rect x="118" y="0" width="104" height="34" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="170" y="21" class="set" text-anchor="middle"><tspan class="bf">B</tspan> : {<tspan class="it">k</tspan>, <tspan class="it">j</tspan>}</text>

  <rect x="236" y="0" width="104" height="34" fill="#EDF3F4" stroke="#1F6C74" stroke-width="0.5"/>
  <text x="288" y="21" class="setBg" text-anchor="middle"><tspan class="bf">C</tspan> : {<tspan class="it">i</tspan>, <tspan class="it">j</tspan>}</text>
</g>

<text x="230" y="106" class="small" text-anchor="middle"><tspan class="it">k</tspan> consumed by sum &#8212; vanishes from the output</text>

<line x1="20" y1="122" x2="440" y2="122" stroke="#BFC3C5" stroke-width="0.3"/>

<!-- Backward section -->
<text x="230" y="148" class="title" text-anchor="middle">Backward: derive &#8706;<tspan class="bf">A</tspan> from &#8706;<tspan class="bf">C</tspan> and <tspan class="bf">B</tspan></text>
<text x="230" y="166" class="label" text-anchor="middle">Coordinate set subtraction</text>

<g transform="translate(56, 174)">
  <rect x="0" y="0" width="96" height="34" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="48" y="21" class="set" text-anchor="middle">&#8706;<tspan class="bf">C</tspan> : {<tspan class="it">i</tspan>, <tspan class="it">j</tspan>}</text>

  <text x="110" y="22" class="body" text-anchor="middle">&#8722;</text>

  <rect x="124" y="0" width="96" height="34" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="172" y="21" class="set" text-anchor="middle"><tspan class="bf">A</tspan> : {<tspan class="it">i</tspan>, <tspan class="it">k</tspan>}</text>

  <text x="235" y="22" class="body" text-anchor="middle">=</text>

  <rect x="249" y="0" width="50" height="34" fill="#EDF3F4" stroke="#1F6C74" stroke-width="0.5"/>
  <text x="274" y="21" class="setBg" text-anchor="middle">{<tspan class="it">j</tspan>}</text>
</g>

<text x="230" y="232" class="small" text-anchor="middle">The coordinate in &#8706;<tspan class="bf">C</tspan> that <tspan class="bf">A</tspan> lacks is the one summed over.</text>

<!-- Formula -->
<text x="230" y="260" class="formula" text-anchor="middle">&#8706;<tspan class="bf">A</tspan>[<tspan class="it">i</tspan>, <tspan class="it">k</tspan>] = &#931;<tspan class="sub">j</tspan> &#8706;<tspan class="bf">C</tspan>[<tspan class="it">i</tspan>, <tspan class="it">j</tspan>] &#183; <tspan class="bf">B</tspan>[<tspan class="it">k</tspan>, <tspan class="it">j</tspan>]</text>

<!-- Formula visual: dC + B → dA -->
<g transform="translate(52, 276)">
  <rect x="0" y="0" width="90" height="34" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="45" y="21" class="small" text-anchor="middle">&#8706;<tspan class="bf">C</tspan>[<tspan class="it">i</tspan>, <tspan class="it">j</tspan>]</text>

  <rect x="130" y="0" width="90" height="34" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <text x="175" y="21" class="small" text-anchor="middle"><tspan class="bf">B</tspan>[<tspan class="it">k</tspan>, <tspan class="it">j</tspan>]</text>

  <!-- Convergence arrows -->
  <line x1="93" y1="17" x2="126" y2="17" stroke="#4A5053" stroke-width="0.5" marker-end="url(#arr)"/>
  <line x1="223" y1="17" x2="256" y2="17" stroke="#4A5053" stroke-width="0.5" marker-end="url(#arr)"/>

  <rect x="260" y="0" width="90" height="34" fill="#EDF3F4" stroke="#1F6C74" stroke-width="0.5"/>
  <text x="305" y="21" class="setBg" text-anchor="middle">&#8706;<tspan class="bf">A</tspan>[<tspan class="it">i</tspan>, <tspan class="it">k</tspan>]</text>

  <text x="100" y="12" class="label" text-anchor="middle">sum j</text>
</g>

<!-- Bottom rule -->
<line x1="12" y1="340" x2="448" y2="340" stroke="#BFC3C5" stroke-width="0.3"/>
<text x="230" y="362" class="body" text-anchor="middle">The pullback rule: sum over every coordinate the output has that the operand lacks. The other operand provides the rest.</text>
</svg>
