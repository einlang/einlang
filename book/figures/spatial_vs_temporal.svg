<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="100%">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#4A5053"/>
  </marker>
  <marker id="arrRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#86343C"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .title  { font-size: 12px; fill: #262626; font-weight: bold; }
  .body   { font-size: 10px; fill: #262626; }
  .small  { font-size: 8.5px; fill: #262626; }
  .accent { font-size: 9px; fill: #1F6C74; font-weight: bold; }
  .warn   { font-size: 8.5px; fill: #86343C; font-weight: bold; }
  .label  { font-size: 8px; fill: #5C6063; }
  .it     { font-style: italic; }
  .bf     { font-weight: bold; }
</style>

<!-- Title -->
<text x="290" y="20" class="title" text-anchor="middle">Two kinds of coordinate</text>

<!-- ===== LEFT: 2D DP — both coords have offsets ===== -->
<g transform="translate(18, 44)">
  <text x="120" y="0"  class="accent" text-anchor="middle"><tspan class="bf">DP</tspan>[<tspan class="it">i</tspan>,<tspan class="it">j</tspan>] — two offsets</text>

  <!-- Grid: 4×4 dots -->
  <g fill="#262626">
    <circle cx="58" cy="44" r="3"/><circle cx="90" cy="44" r="3"/>
    <circle cx="122" cy="44" r="3"/><circle cx="154" cy="44" r="3"/>
    <circle cx="58" cy="72" r="3"/><circle cx="90" cy="72" r="3"/>
    <circle cx="122" cy="72" r="3"/><circle cx="154" cy="72" r="3"/>
    <circle cx="58" cy="100" r="3"/><circle cx="90" cy="100" r="3"/>
    <circle cx="122" cy="100" r="3"/><circle cx="154" cy="100" r="3"/>
    <circle cx="58" cy="128" r="3"/><circle cx="90" cy="128" r="3"/>
    <circle cx="122" cy="128" r="3"/>
    <circle cx="154" cy="128" r="7" fill="#EDF3F4"/>
  </g>

  <text x="14" y="48"  class="small" text-anchor="end"><tspan class="it">i</tspan>=0</text>
  <text x="14" y="76"  class="small" text-anchor="end"><tspan class="it">i</tspan>=1</text>
  <text x="14" y="104" class="small" text-anchor="end"><tspan class="it">i</tspan>=2</text>
  <text x="14" y="132" class="small" text-anchor="end"><tspan class="it">i</tspan>=3</text>

  <text x="58"  y="36" class="small" text-anchor="middle"><tspan class="it">j</tspan>=0</text>
  <text x="90"  y="36" class="small" text-anchor="middle"><tspan class="it">j</tspan>=1</text>
  <text x="122" y="36" class="small" text-anchor="middle"><tspan class="it">j</tspan>=2</text>
  <text x="154" y="36" class="small" text-anchor="middle"><tspan class="it">j</tspan>=3</text>

  <!-- Arrows: (2,3)↓, (3,2)→, (2,2)↘ to (3,3) -->
  <line x1="154" y1="106" x2="154" y2="117" stroke="#4A5053" stroke-width="0.7" marker-end="url(#arr)"/>
  <line x1="128" y1="128" x2="143" y2="128" stroke="#4A5053" stroke-width="0.7" marker-end="url(#arr)"/>
  <line x1="128" y1="106" x2="143" y2="117" stroke="#4A5053" stroke-width="0.7" marker-end="url(#arr)"/>

  <text x="120" y="176" class="small" text-anchor="middle"><tspan class="bf">DP</tspan>[<tspan class="it">i</tspan>,<tspan class="it">j</tspan>] = min(<tspan class="bf">DP</tspan>[<tspan class="it">i</tspan>−1,<tspan class="it">j</tspan>], <tspan class="bf">DP</tspan>[<tspan class="it">i</tspan>,<tspan class="it">j</tspan>−1], <tspan class="bf">DP</tspan>[<tspan class="it">i</tspan>−1,<tspan class="it">j</tspan>−1])</text>
  <text x="120" y="194" class="small" text-anchor="middle"><tspan class="it">i</tspan>−1, <tspan class="it">j</tspan>−1 — both have offsets. Both are recurrence coords.</text>
</g>

<!-- Divider -->
<line x1="280" y1="44" x2="280" y2="256" stroke="#BFC3C5" stroke-width="0.3"/>

<!-- ===== RIGHT: One recurrence coord + one bookshelf ===== -->
<g transform="translate(300, 44)">
  <text x="112" y="0"  class="accent" text-anchor="middle"><tspan class="bf">h</tspan>[<tspan class="it">t</tspan>,<tspan class="it">i</tspan>] — one offset</text>

  <!-- Time axis -->
  <line x1="20" y1="30" x2="20" y2="190" stroke="#BFC3C5" stroke-width="0.4"/>
  <polygon points="20,22 16,30 24,30" fill="#BFC3C5"/>

  <!-- ===== t+1: full row — all dashed (future, not available) ===== -->
  <text x="20" y="50" class="label" text-anchor="end"><tspan class="it">t</tspan>+1</text>
  <text x="172" y="50" class="warn" text-anchor="start">future — off limits</text>

  <line x1="46" y1="44" x2="202" y2="44" stroke="#86343C" stroke-width="0.4" stroke-dasharray="3,2"/>
  <circle cx="56"  cy="44" r="4" fill="#F6EEEF" stroke-dasharray="3,2"/>
  <circle cx="82"  cy="44" r="4" fill="#F6EEEF" stroke-dasharray="3,2"/>
  <circle cx="108" cy="44" r="4" fill="#F6EEEF" stroke-dasharray="3,2"/>
  <circle cx="134" cy="44" r="4" fill="#F6EEEF" stroke-dasharray="3,2"/>
  <circle cx="160" cy="44" r="4" fill="#F6EEEF" stroke-dasharray="3,2"/>

  <!-- Red dashed arrow from t to t+1 -->
  <line x1="108" y1="90" x2="108" y2="52" stroke="#86343C" stroke-width="0.6" marker-end="url(#arrRed)" stroke-dasharray="4,3"/>

  <!-- ===== t: full row — all solid (computing) ===== -->
  <text x="20" y="106" class="label" text-anchor="end"><tspan class="it">t</tspan></text>

  <line x1="46" y1="100" x2="202" y2="100" stroke="#262626" stroke-width="0.5"/>
  <circle cx="56"  cy="100" r="4.5" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <circle cx="82"  cy="100" r="4.5" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <circle cx="108" cy="100" r="7" fill="#EDF3F4"/>
  <circle cx="134" cy="100" r="4.5" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <circle cx="160" cy="100" r="4.5" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>

  <text x="108" y="126" class="small" text-anchor="middle"><tspan class="bf">h</tspan>[<tspan class="it">t</tspan>,<tspan class="it">i</tspan>]</text>

  <!-- ===== t-1: full row — all solid (available) ===== -->
  <text x="20" y="166" class="label" text-anchor="end"><tspan class="it">t</tspan>−1</text>

  <line x1="46" y1="160" x2="202" y2="160" stroke="#262626" stroke-width="0.5"/>
  <circle cx="56"  cy="160" r="4.5" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <circle cx="82"  cy="160" r="5.5" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <circle cx="108" cy="160" r="5.5" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <circle cx="134" cy="160" r="5.5" fill="#ffffff" stroke="#262626" stroke-width="0.7"/>
  <circle cx="160" cy="160" r="4.5" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>

  <text x="82"  y="178" class="small" text-anchor="middle"><tspan class="it">i</tspan>−1</text>
  <text x="108" y="178" class="small" text-anchor="middle"><tspan class="it">i</tspan></text>
  <text x="134" y="178" class="small" text-anchor="middle"><tspan class="it">i</tspan>+1</text>

  <!-- Arrows from t-1 cells to the t cell — all going upward -->
  <line x1="82" y1="152" x2="100" y2="109" stroke="#4A5053" stroke-width="0.7" marker-end="url(#arr)"/>
  <line x1="108" y1="152" x2="108" y2="109" stroke="#4A5053" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="134" y1="152" x2="116" y2="109" stroke="#4A5053" stroke-width="0.7" marker-end="url(#arr)"/>

  <!-- All cells at t-1: every i is accessible -->
  <text x="188" y="168" class="label" text-anchor="start">all <tspan class="it">i</tspan> visible</text>

  <!-- Equation -->
  <text x="112" y="202" class="small" text-anchor="middle"><tspan class="bf">h</tspan>[<tspan class="it">t</tspan>,<tspan class="it">i</tspan>] = f(<tspan class="bf">h</tspan>[<tspan class="it">t</tspan>−1, <tspan class="it">i</tspan>−1], <tspan class="bf">h</tspan>[<tspan class="it">t</tspan>−1, <tspan class="it">i</tspan>], <tspan class="bf">h</tspan>[<tspan class="it">t</tspan>−1, <tspan class="it">i</tspan>+1])</text>
  <text x="112" y="218" class="small" text-anchor="middle"><tspan class="it">t</tspan>−1 makes <tspan class="it">t</tspan> a recurrence coord. <tspan class="it">i</tspan>−1/<tspan class="it">i</tspan>+1 are spatial — the full <tspan class="it">t</tspan>−1 slice is available.</text>
</g>

<!-- Bottom rule -->
<line x1="30" y1="270" x2="550" y2="270" stroke="#BFC3C5" stroke-width="0.3"/>
<text x="290" y="290" class="small" text-anchor="middle">Left: both offsets on <tspan class="bf">DP</tspan> — <tspan class="it">i</tspan> and <tspan class="it">j</tspan> are recurrence. Right: only <tspan class="it">t</tspan>−1 is on <tspan class="bf">h</tspan> — <tspan class="it">t</tspan> is recurrence, <tspan class="it">i</tspan> is a bookshelf.</text>
</svg>
