<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 274" width="100%" height="100%">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#4a4a4a"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .title { font-size: 12px; fill: #262626; font-weight: bold; }
  .body  { font-size: 10px; fill: #262626; }
  .small { font-size: 8.5px; fill: #262626; }
  .accent{ font-size: 8.5px; fill: #1f6d7a; font-weight: bold; }
  .label { font-size: 8px; fill: #5c5c5c; }
  .bf    { font-weight: bold; }
  .it    { font-style: italic; }
</style>

<!-- Left panel: bias[j] broadcasts over i -->
<g transform="translate(76,34)">
  <rect x="0" y="0" width="116" height="86" fill="#ffffff" stroke="#262626" stroke-width="0.8"/>
  <text x="58" y="48" class="body" text-anchor="middle"><tspan class="bf">A</tspan>[<tspan class="it">i</tspan>, <tspan class="it">j</tspan>]</text>

  <text x="58" y="-8" class="label" text-anchor="middle">j</text>
  <text x="-18" y="43" class="label" text-anchor="end" transform="rotate(-90,-18,43)">i</text>

  <rect x="0" y="104" width="116" height="20" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="58" y="118" class="accent" text-anchor="middle"><tspan class="bf">bias</tspan>[<tspan class="it">j</tspan>]</text>

  <line x1="29" y1="104" x2="29" y2="0" stroke="#4a4a4a" stroke-width="0.7" marker-end="url(#arr)" stroke-dasharray="3,3"/>
  <line x1="58" y1="104" x2="58" y2="0" stroke="#4a4a4a" stroke-width="0.7" marker-end="url(#arr)" stroke-dasharray="3,3"/>
  <line x1="87" y1="104" x2="87" y2="0" stroke="#4a4a4a" stroke-width="0.7" marker-end="url(#arr)" stroke-dasharray="3,3"/>

  <text x="58" y="140" class="small" text-anchor="middle">repeats for each i</text>
</g>

<line x1="230" y1="22" x2="230" y2="200" stroke="#c4c4c4" stroke-width="0.3"/>

<!-- Right panel: bias[i] broadcasts over j -->
<g transform="translate(280,34)">
  <rect x="0" y="0" width="116" height="86" fill="#ffffff" stroke="#262626" stroke-width="0.8"/>
  <text x="58" y="48" class="body" text-anchor="middle"><tspan class="bf">A</tspan>[<tspan class="it">i</tspan>, <tspan class="it">j</tspan>]</text>

  <text x="58" y="-8" class="label" text-anchor="middle">j</text>
  <text x="-18" y="43" class="label" text-anchor="end" transform="rotate(-90,-18,43)">i</text>

  <rect x="-44" y="0" width="20" height="86" fill="#e6f0f3" stroke="#1f6d7a" stroke-width="0.5"/>
  <text x="-34" y="43" class="accent" text-anchor="middle" transform="rotate(-90,-34,43)"><tspan class="bf">bias</tspan>[<tspan class="it">i</tspan>]</text>

  <line x1="-24" y1="22" x2="112" y2="22" stroke="#4a4a4a" stroke-width="0.7" marker-end="url(#arr)" stroke-dasharray="3,3"/>
  <line x1="-24" y1="43" x2="112" y2="43" stroke="#4a4a4a" stroke-width="0.7" marker-end="url(#arr)" stroke-dasharray="3,3"/>
  <line x1="-24" y1="64" x2="112" y2="64" stroke="#4a4a4a" stroke-width="0.7" marker-end="url(#arr)" stroke-dasharray="3,3"/>

  <text x="58" y="140" class="small" text-anchor="middle">repeats for each j</text>
</g>

<line x1="10" y1="216" x2="450" y2="216" stroke="#c4c4c4" stroke-width="0.3"/>
<text x="230" y="236" class="body" text-anchor="middle">Both produce <tspan class="bf">out</tspan>[<tspan class="it">i</tspan>, <tspan class="it">j</tspan>]. Identical shape, indistinguishable by shape.</text>
<text x="230" y="254" class="body" text-anchor="middle">The coordinate name is the semantics.</text>
</svg>
