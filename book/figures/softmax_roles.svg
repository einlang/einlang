<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 308" width="100%" height="100%">
<defs>
  <marker id="arrA" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
    <path d="M0,0 L6,2.5 L0,5 Z" fill="#1f6d7a"/>
  </marker>
  <marker id="arrB" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
    <path d="M0,0 L6,2.5 L0,5 Z" fill="#627584"/>
  </marker>
</defs>

<style>
  text { font-family: "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
  .title  { font-size: 11px; fill: #262626; font-weight: bold; }
  .body   { font-size: 10px; fill: #262626; }
  .small  { font-size: 8.5px; fill: #262626; }
  .accA   { font-size: 8.5px; fill: #1f6d7a; font-weight: bold; }
  .accB   { font-size: 8.5px; fill: #627584; font-weight: bold; }
  .label  { font-size: 7.5px; fill: #5c5c5c; font-style: italic; }
  .cell   { font-size: 10px; fill: #262626; }
  .it     { font-style: italic; }
  .bf     { font-weight: bold; }
</style>

<!-- ===== Input matrix ===== -->
<g transform="translate(212,36)">
  <text x="58" y="-18" class="title" text-anchor="middle">Input <tspan class="bf">L</tspan>[<tspan class="it">batch</tspan>, <tspan class="it">class</tspan>]</text>

  <rect x="0" y="0" width="116" height="78" fill="#ffffff" stroke="#262626" stroke-width="0.6"/>
  <line x1="0" y1="26" x2="116" y2="26" stroke="#e8e8e8" stroke-width="0.4"/>
  <line x1="0" y1="52" x2="116" y2="52" stroke="#e8e8e8" stroke-width="0.4"/>
  <line x1="39" y1="0" x2="39" y2="78" stroke="#e8e8e8" stroke-width="0.4"/>
  <line x1="78" y1="0" x2="78" y2="78" stroke="#e8e8e8" stroke-width="0.4"/>

  <text x="19" y="18" class="cell" text-anchor="middle">2.0</text>
  <text x="58" y="18" class="cell" text-anchor="middle">1.0</text>
  <text x="97" y="18" class="cell" text-anchor="middle">0.1</text>
  <text x="19" y="44" class="cell" text-anchor="middle">0.5</text>
  <text x="58" y="44" class="cell" text-anchor="middle">2.0</text>
  <text x="97" y="44" class="cell" text-anchor="middle">0.3</text>
  <text x="19" y="70" class="cell" text-anchor="middle">0.1</text>
  <text x="58" y="70" class="cell" text-anchor="middle">0.2</text>
  <text x="97" y="70" class="cell" text-anchor="middle">2.0</text>

  <text x="19" y="-5" class="label" text-anchor="middle">cat</text>
  <text x="58" y="-5" class="label" text-anchor="middle">dog</text>
  <text x="97" y="-5" class="label" text-anchor="middle">fish</text>
  <text x="-6" y="18" class="label" text-anchor="end">img₁</text>
  <text x="-6" y="44" class="label" text-anchor="end">img₂</text>
  <text x="-6" y="70" class="label" text-anchor="end">img₃</text>
</g>

<!-- Arrows -->
<line x1="250" y1="116" x2="153" y2="160" stroke="#1f6d7a" stroke-width="0.6" marker-end="url(#arrA)"/>
<line x1="290" y1="116" x2="387" y2="160" stroke="#627584" stroke-width="0.6" marker-end="url(#arrB)"/>

<!-- ===== Left: softmax[class] — row dividers emphasized ===== -->
<g transform="translate(68,170)">
  <text x="58" y="-15" class="accA" text-anchor="middle">softmax[<tspan class="it">class</tspan>]</text>

  <rect x="0" y="0" width="116" height="78" fill="#ffffff" stroke="#1f6d7a" stroke-width="0.7"/>

  <!-- Horizontal row dividers — emphasized -->
  <line x1="0" y1="26" x2="116" y2="26" stroke="#1f6d7a" stroke-width="0.5" opacity="0.45"/>
  <line x1="0" y1="52" x2="116" y2="52" stroke="#1f6d7a" stroke-width="0.5" opacity="0.45"/>
  <!-- Vertical col dividers — subtle -->
  <line x1="39" y1="0" x2="39" y2="78" stroke="#e8e8e8" stroke-width="0.3"/>
  <line x1="78" y1="0" x2="78" y2="78" stroke="#e8e8e8" stroke-width="0.3"/>

  <text x="19" y="18" class="cell" text-anchor="middle">0.66</text>
  <text x="58" y="18" class="cell" text-anchor="middle">0.24</text>
  <text x="97" y="18" class="cell" text-anchor="middle">0.10</text>
  <text x="19" y="44" class="cell" text-anchor="middle">0.16</text>
  <text x="58" y="44" class="cell" text-anchor="middle">0.71</text>
  <text x="97" y="44" class="cell" text-anchor="middle">0.13</text>
  <text x="19" y="70" class="cell" text-anchor="middle">0.11</text>
  <text x="58" y="70" class="cell" text-anchor="middle">0.13</text>
  <text x="97" y="70" class="cell" text-anchor="middle">0.76</text>

  <text x="19" y="-5" class="label" text-anchor="middle">cat</text>
  <text x="58" y="-5" class="label" text-anchor="middle">dog</text>
  <text x="97" y="-5" class="label" text-anchor="middle">fish</text>
  <text x="-6" y="18" class="label" text-anchor="end">img₁</text>
  <text x="-6" y="44" class="label" text-anchor="end">img₂</text>
  <text x="-6" y="70" class="label" text-anchor="end">img₃</text>

  <line x1="122" y1="13" x2="136" y2="13" stroke="#1f6d7a" stroke-width="0.5" marker-end="url(#arrA)"/>
  <line x1="122" y1="39" x2="136" y2="39" stroke="#1f6d7a" stroke-width="0.5" marker-end="url(#arrA)"/>
  <line x1="122" y1="65" x2="136" y2="65" stroke="#1f6d7a" stroke-width="0.5" marker-end="url(#arrA)"/>
  <text x="144" y="36" class="accA" text-anchor="start">each</text>
  <text x="144" y="48" class="accA" text-anchor="start">row=1</text>
</g>

<!-- ===== Right: softmax[batch] — column dividers emphasized ===== -->
<g transform="translate(356,170)">
  <text x="58" y="-15" class="accB" text-anchor="middle">softmax[<tspan class="it">batch</tspan>]</text>

  <rect x="0" y="0" width="116" height="78" fill="#ffffff" stroke="#627584" stroke-width="0.7"/>

  <!-- Horizontal row dividers — subtle -->
  <line x1="0" y1="26" x2="116" y2="26" stroke="#e8e8e8" stroke-width="0.3"/>
  <line x1="0" y1="52" x2="116" y2="52" stroke="#e8e8e8" stroke-width="0.3"/>
  <!-- Vertical column dividers — emphasized -->
  <line x1="39" y1="0" x2="39" y2="78" stroke="#627584" stroke-width="0.5" opacity="0.45"/>
  <line x1="78" y1="0" x2="78" y2="78" stroke="#627584" stroke-width="0.5" opacity="0.45"/>

  <text x="19" y="18" class="cell" text-anchor="middle">0.73</text>
  <text x="58" y="18" class="cell" text-anchor="middle">0.24</text>
  <text x="97" y="18" class="cell" text-anchor="middle">0.11</text>
  <text x="19" y="44" class="cell" text-anchor="middle">0.16</text>
  <text x="58" y="44" class="cell" text-anchor="middle">0.65</text>
  <text x="97" y="44" class="cell" text-anchor="middle">0.14</text>
  <text x="19" y="70" class="cell" text-anchor="middle">0.11</text>
  <text x="58" y="70" class="cell" text-anchor="middle">0.11</text>
  <text x="97" y="70" class="cell" text-anchor="middle">0.75</text>

  <text x="19" y="-5" class="label" text-anchor="middle">cat</text>
  <text x="58" y="-5" class="label" text-anchor="middle">dog</text>
  <text x="97" y="-5" class="label" text-anchor="middle">fish</text>
  <text x="-6" y="18" class="label" text-anchor="end">img₁</text>
  <text x="-6" y="44" class="label" text-anchor="end">img₂</text>
  <text x="-6" y="70" class="label" text-anchor="end">img₃</text>

  <line x1="19" y1="83" x2="19" y2="96" stroke="#627584" stroke-width="0.5" marker-end="url(#arrB)"/>
  <line x1="58" y1="83" x2="58" y2="96" stroke="#627584" stroke-width="0.5" marker-end="url(#arrB)"/>
  <line x1="97" y1="83" x2="97" y2="96" stroke="#627584" stroke-width="0.5" marker-end="url(#arrB)"/>
  <text x="58" y="112" class="accB" text-anchor="middle">each col=1</text>
</g>

<line x1="20" y1="284" x2="520" y2="284" stroke="#c4c4c4" stroke-width="0.3"/>
<text x="270" y="302" class="body" text-anchor="middle">Same input, identical output shape. The coordinate name records which meaning was intended.</text>
</svg>
