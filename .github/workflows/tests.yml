name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[test]'

      - name: Run tests
        env:
          EINLANG_ROUND_TRIP: "1"
        run: python3 -m pytest tests/ -n auto --tb=short -q

  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build book PDF
        uses: ./.github/actions/build-book

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: book/the-name-in-the-bracket.pdf
          retention-days: 5

      - name: Comment PR with artifact link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Book PDF built: [download](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
