name: Build Book PDF

on:
  push:
    branches: [main]
    paths:
      - "book/**.md"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build book PDF
        uses: ./.github/actions/build-book

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1

      - name: Copy PDF into Pages output
        run: sudo cp book/the-name-in-the-bracket.pdf _site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
