name: Build and Deploy PDFs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "paper/**"
      - "thesis/**"
      - ".github/actions/build-pdfs/**"
      - ".github/workflows/build-book-pdf.yml"
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build all PDFs
        uses: ./.github/actions/build-pdfs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy PDFs into site source
        run: |
          cp book/the-name-in-the-bracket.pdf .
          cp paper/einlang_paper.pdf .
          cp thesis/einlang_thesis.pdf .

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
