name: Build and Deploy PDFs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "paper/**"
      - "thesis/**"
      - ".github/actions/build-pdfs/**"
      - ".github/workflows/build-pdfs.yml"
  pull_request:
    paths:
      - "book/**"
      - "paper/**"
      - "thesis/**"
      - ".github/actions/build-pdfs/**"
      - ".github/workflows/build-pdfs.yml"
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build all PDFs
        uses: ./.github/actions/build-pdfs

      - name: Upload book PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-the-name-in-the-bracket
          path: book/the-name-in-the-bracket.pdf

      - name: Upload paper PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-einlang-paper
          path: paper/einlang_paper.pdf

      - name: Upload thesis PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-einlang-thesis
          path: thesis/einlang_thesis.pdf

      - name: Post PDF links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId,
            });

            const links = artifacts.artifacts.map(a =>
              `- [${a.name}.pdf](https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${a.id})`
            ).join('\n');

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## PDFs built from ${context.sha.substring(0, 7)}\n\n${links}`,
            });

      - name: Copy PDFs into site source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp book/the-name-in-the-bracket.pdf .
          cp paper/einlang_paper.pdf .
          cp thesis/einlang_thesis.pdf .

      - name: Build Jekyll site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/jekyll-build-pages@v1

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build-pdfs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
