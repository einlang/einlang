name: Build All PDFs
description: Install pandoc + tectonic, build book/paper/thesis PDFs and render figures

runs:
  using: composite
  steps:
    - name: Install pandoc and PDF engine
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq pandoc poppler-utils
        TECTONIC_URL="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL "$TECTONIC_URL" -o /tmp/tectonic.tar.gz
        sudo mkdir -p /tmp/tectonic-extract
        sudo tar xzf /tmp/tectonic.tar.gz -C /tmp/tectonic-extract
        sudo find /tmp/tectonic-extract -name tectonic -type f -exec cp {} /usr/local/bin/tectonic \;
        sudo chmod +x /usr/local/bin/tectonic

    - name: Concatenate chapters
      shell: bash
      run: |
        python3 << 'PYEOF'
        import os

        chapters = [
            "chapter-01-ghost-in-the-name.md",
            "chapter-02-megaphone-promise.md",
            "chapter-03-names-as-contracts.md",
            "chapter-04-broadcast-self-audit.md",
            "chapter-05-blocks-skeletons.md",
            "chapter-06-names-in-time.md",
            "chapter-07-complex-terrain.md",
            "chapter-08-gradients.md",
            "chapter-09-comparison-normalization.md",
            "chapter-10-comparison-attention.md",
            "chapter-11-comparison-physics.md",
            "chapter-12-shape-of-thought.md",
            "chapter-13-name-in-mirror.md",
            "chapter-14-firewood.md",
            "chapter-15-outline-of-name.md",
            "chapter-16-complete-picture.md",
            "chapter-epilogue.md",
        ]

        parts = []
        for ch in chapters:
            path = os.path.join("book", ch)
            if not os.path.exists(path):
                print(f"WARNING: {path} not found, skipping")
                continue
            with open(path) as f:
                content = f.read()
            if content.startswith("---"):
                end = content.find("---", 3)
                if end != -1:
                    content = content[end + 3:].lstrip()
            parts.append(r"\newpage")
            parts.append(content)

        with open("book/_combined.md", "w") as f:
            f.write("\n\n".join(parts))

        print(f"Combined {len(chapters)} chapters")
        PYEOF

    - name: Install librsvg
      shell: bash
      run: sudo apt-get install -y -qq librsvg2-bin

    - name: Render figures (svg → pdf)
      shell: bash
      run: |
        cd book/figures
        for f in *.svg; do
          echo "Converting $f ..."
          w=$(python3 -c "print(int((8.5 - 2 * 0.8) * 96))")
          rsvg-convert -f pdf -w "$w" -o "${f%.svg}.pdf" "$f"
        done

    - name: Build PDF with pandoc
      shell: bash
      run: |
        cat > /tmp/svg-to-pdf.lua << 'LUAEOF'
        function Image(img) img.src = img.src:gsub('%.svg$', '.pdf'); return img end
        function HorizontalRule()
          return pandoc.RawBlock('latex', '\\vspace{2em}')
        end
        LUAEOF
        pandoc book/_combined.md \
          -s \
          --resource-path=book \
          --lua-filter=/tmp/svg-to-pdf.lua \
          --from=markdown+pipe_tables+fenced_code_blocks+grid_tables \
          --toc --toc-depth=2 \
          --metadata title="The Name in the Bracket" \
          --metadata author="einlang" \
          --metadata date="$(date +%Y-%m-%d)" \
          -V fontsize=11pt \
          -V geometry=margin=0.8in \
          -V colorlinks=true \
          -o book/_combined.tex
        python3 << 'PYEOF'
        with open("book/_combined.tex") as f:
            c = f.read()
        c = c.replace('[11pt,', '[11pt,titlepage')
        c = c.replace('{\\linethickness}', '{0.5pt}')
        with open("book/_combined.tex", "w") as f:
            f.write(c)
        PYEOF
        tectonic book/_combined.tex
        mv book/_combined.pdf book/the-name-in-the-bracket.pdf

    - name: Build paper PDF
      shell: bash
      run: |
        tectonic paper/einlang_paper.tex

    - name: Build thesis PDF
      shell: bash
      run: |
        tectonic thesis/einlang_thesis.tex
