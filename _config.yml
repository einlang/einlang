# GitHub Pages: deploy from branch main, folder / (root)
# Site: https://einlang.github.io/einlang/
# Renders the root site plus the public book/ folder. Reference docs remain
# excluded from Pages and are read on GitHub.
title: Einlang
url: "https://einlang.github.io"
baseurl: "/einlang"
exclude:
  - README.md
  - CONTRIBUTING.md
  - docs
  - examples
  - src
  - tests
  - stdlib
  - scripts
  - .github
  - "*.py"
  - "*.ein"
  - .cursorrules
  - .gitignore
  - LICENSE
